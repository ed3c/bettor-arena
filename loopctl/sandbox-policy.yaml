# sandbox-policy.yaml — what an EXTERNAL caller's sandbox may touch.
#
#   openshell sandbox create --policy loopctl/sandbox-policy.yaml …
#
# This is the half the container layer could not express. A bind-mount plus a
# host uid keeps external work off the host tree; it says nothing about where
# that work may connect, and "external callers must not reach my infrastructure"
# is a network question at least as much as a filesystem one.
#
# Written as a DENY-BY-DEFAULT surface: nothing is reachable unless named here,
# so a new endpoint is an explicit edit rather than something that quietly starts
# working. The cost is real — an agent that needs a host nobody listed fails —
# and that is the intended failure: a refusal names what was missing, whereas an
# open egress names nothing at all.
#
# NOT a substitute for the git-anchored proofs. An upload-based sandbox carries
# no .git, so the loops' receipts and replay cannot live here (proof_workflow
# /README.md §3). This policy governs sandboxes that RUN AGENT TURNS.

version: 1

filesystem_policy:
  # The workspace is the only writable place that survives the turn. /tmp is
  # writable because the toolchain needs scratch, and /dev/null because a
  # sandbox that cannot discard output makes every tool's quiet mode fail.
  include_workdir: true
  read_only: [/usr, /lib, /bin, /sbin, /etc, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  # best_effort rather than strict: on a kernel without Landlock, strict would
  # refuse to start and the sandbox would look broken rather than degraded. The
  # network policy below is enforced by the proxy either way, so the filesystem
  # tier degrading does not silently open egress.
  compatibility: best_effort

network_policies:
  # The model endpoints, and only these. Hosts taken from the runtime's own
  # backend defaults rather than guessed:
  # crates/openshell-router/src/backend.rs names api.anthropic.com and
  # api.openai.com as the provider bases.
  anthropic:
    name: anthropic-messages
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    # Only the writing role's binary may use it. A sandbox where any process can
    # reach the model API is one `curl` away from being a general egress.
    #
    # THE BINDING IS NOW LOAD-BEARING FOR A SECOND REASON, and the second one is
    # easier to argue away. The subscription credential does not live in the
    # sandbox: `claude setup-token` mints a long-lived bearer on the host, it is
    # handed to the gateway as
    #
    #   openshell provider create --name claude-code --type generic \
    #     --credential CLAUDE_CODE_OAUTH_TOKEN=<token>
    #
    # and what the sandbox actually receives is a PLACEHOLDER — measured, not
    # read from the docs: a probe sandbox on gateway 0.0.59 printed
    # `openshell:resolve:env:v<n>_CLAUDE_CODE_OAUTH_TOKEN`. The proxy substitutes
    # the real value into the outbound request.
    #
    # Which makes the placeholder a CAPABILITY, not a secret: every process in
    # the sandbox can read it, and any of them that could reach this host would
    # have the proxy sign requests on its behalf. So "the token isn't in here
    # anyway, the binary list is belt-and-braces" is exactly backwards — with the
    # placeholder model the binary list is the only thing left holding the line.
    #
    # No refresh endpoint is named. The minted token is used directly as a
    # bearer, and if a build ever does need one, deny-by-default means the
    # refusal names the host instead of the sandbox quietly reaching it.
    binaries:
      - path: /usr/local/bin/claude

  openai:
    name: openai-responses
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/codex

  # Codex on a ChatGPT subscription does NOT dial api.openai.com. Read out of the
  # shipped CLI rather than assumed: the binary carries
  # `https://chatgpt.com/backend-api/codex`, and with only the entry above a
  # subscription-mode turn is denied by a policy that looks like it admits codex.
  #
  # Same binary binding, and here it is doing more work than it looks. The token
  # reaching this sandbox is a REAL access token, not a placeholder — codex
  # parses its credential as a JWT before any request, so the placeholder model
  # that carries claude cannot carry codex. That trade is stated in
  # proof_workflow/README.md; what belongs here is the consequence: the secret is
  # readable inside the sandbox, so the set of processes allowed to spend it is
  # the only remaining boundary.
  codex_chatgpt:
    name: codex-chatgpt-backend
    endpoints:
      - host: chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/codex

  # The loops, as MCP. host.docker.internal is the runtime's alias for this
  # machine and is named ONLY for this port — Forgejo on :3000 and everything
  # else local stay unreachable, which control_sandbox_policy.sh proves rather
  # than assumes.
  #
  # PER-TOOL RULES ARE NOT HERE, and their absence is the point. The installed
  # gateway (0.0.59) matches MCP by method only: its policy parser rejects a
  # `tool:` matcher outright ("field `tool`, expected one of `method`, `path`,
  # `command`, `query`"). The newer source checkout documents per-tool matching,
  # which is how it came to be written here first — a spec read from a newer tree
  # than the one that is running.
  #
  # So this endpoint can only allow or deny tools/call AS A WHOLE, and the tool
  # allowlist lives in mcp_server.py's DENIED_TOOLS instead. Authorization must
  # not depend on a capability the running version lacks; when the gateway gains
  # per-tool rules they become defence in depth over the server's check, never a
  # replacement for it.
  loopctl_mcp:
    name: loopctl-mcp
    endpoints:
      - host: host.docker.internal
        port: 8765
        path: /mcp
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/python3
      - path: /usr/local/bin/codex

# Deliberately absent, each for a stated reason rather than an oversight:
#
#   * no git remote, no package registry. A turn that needs to fetch is a turn
#     whose inputs were not uploaded, and silently allowing the fetch would hide
#     that the packet was incomplete.
#   * NO Forgejo, and no other localhost service. The issue tracker, the gateway
#     and the databases on this machine are exactly the infrastructure an
#     external caller must not reach. Naming host.docker.internal for the MCP
#     port above does NOT open the host: the endpoint is per host-AND-port, and
#     control_sandbox_policy.sh asserts :3000 still answers 403 to a sandbox.
