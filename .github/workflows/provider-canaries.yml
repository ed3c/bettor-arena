name: Provider canary contracts

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'docs/knowledge-providers/live/**'
      - 'scripts/providers/**'
      - '.runtime-env/workloads/provider-*.json'
      - 'tests/provider-canaries/**'
      - 'scripts/check_knowledge_provider_module.py'
      - '.arena/modules/knowledge-providers/**'
      - '.github/workflows/provider-canaries.yml'
  push:
    branches: [main]
    paths:
      - 'docs/knowledge-providers/live/**'
      - 'scripts/providers/**'
      - '.runtime-env/workloads/provider-*.json'
      - 'tests/provider-canaries/**'
      - 'scripts/check_knowledge_provider_module.py'
      - '.arena/modules/knowledge-providers/**'
      - '.github/workflows/provider-canaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-canaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate canary workloads and planted mutations
        run: sh tests/provider-canaries/run-all.sh
