name: Converge documentation contracts once

on:
  push:
    branches:
      - docs/document-routing-v1

permissions:
  contents: write

concurrency:
  group: converge-doc-contracts-once
  cancel-in-progress: true

jobs:
  converge:
    if: github.actor == 'ed3c'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/document-routing-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11

      - name: Remove this one-shot workflow from the final tree
        run: |
          set -euo pipefail
          git config user.name 'ed3c-contract-bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/converge-doc-contracts-once.yml
          git add .github/workflows/converge-doc-contracts-once.yml
          git commit -m 'chore: remove one-shot contract convergence workflow'

      - name: Iterate generated contracts to a fixed point
        run: |
          set -euo pipefail
          generate() {
            python3 scripts/arena_lock.py resolve \
              --requirements .arena/compositions/bettor-arena.requirements.json \
              --output .arena/locks/bettor-arena.lock.json
            python3 scripts/arena_context.py lock \
              --output .arena/contexts.lock.json
            python3 scripts/arena_context.py parity \
              --output data/context-capsules/driver-parity.json
            python3 scripts/arena_proof.py subjects \
              --output data/module-proof/subjects.lock.json
            python3 scripts/arena_proof.py release \
              --subjects data/module-proof/subjects.lock.json \
              --output data/module-proof/release-receipt.json
            bun loopctl/mcp_tools.ts loopctl/contract.json \
              --policy .arena/mcp-policy.json \
              > data/mcp/exposure.json
            bun scripts/arena_origins.ts status \
              --output data/origins/status.json
            bun scripts/arena_browser.ts status \
              --output data/browser/status.json
          }

          converged=0
          for pass in 1 2 3 4; do
            generate
            git add \
              .arena/locks/bettor-arena.lock.json \
              .arena/contexts.lock.json \
              data/context-capsules/driver-parity.json \
              data/module-proof/subjects.lock.json \
              data/module-proof/release-receipt.json \
              data/mcp/exposure.json \
              data/origins/status.json \
              data/browser/status.json
            if git diff --cached --quiet; then
              echo "CONVERGED at pass ${pass}"
              converged=1
              break
            fi
            git commit -m "chore: converge generated modular contracts pass ${pass}"
          done

          test "$converged" -eq 1
          generate
          git diff --exit-code -- \
            .arena/locks/bettor-arena.lock.json \
            .arena/contexts.lock.json \
            data/context-capsules/driver-parity.json \
            data/module-proof/subjects.lock.json \
            data/module-proof/release-receipt.json \
            data/mcp/exposure.json \
            data/origins/status.json \
            data/browser/status.json

      - name: Push the converged branch
        run: |
          set -euo pipefail
          git push origin HEAD:docs/document-routing-v1
