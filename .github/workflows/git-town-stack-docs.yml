name: Git Town Stack governance docs
# Exact-head trigger after generated contract sync; no runtime or publication authority.

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/git/**
      - docs/README.md
      - docs/INDEX.md
      - docs/architecture/DIRECTORY_STATE_MACHINE_MAP.md
      - docs/architecture/STATE_MACHINES.md
      - docs/architecture/agent-entrypoints.contract.json
      - docs/traceability/STACK_PR_INDEX.md
      - .arena/contexts/macro.json
      - scripts/gates/check_git_town_stack_docs.py
      - tests/test_git_town_stack_docs.py
      - .github/workflows/git-town-stack-docs.yml
  push:
    branches:
      - main
      - 'feat/**'
      - 'integration/**'
      - 'docs/**'
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/git/**
      - docs/README.md
      - docs/INDEX.md
      - docs/architecture/DIRECTORY_STATE_MACHINE_MAP.md
      - docs/architecture/STATE_MACHINES.md
      - docs/architecture/agent-entrypoints.contract.json
      - docs/traceability/STACK_PR_INDEX.md
      - .arena/contexts/macro.json
      - scripts/gates/check_git_town_stack_docs.py
      - tests/test_git_town_stack_docs.py
      - .github/workflows/git-town-stack-docs.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate repository profile and Stack index
        run: python3 scripts/gates/check_git_town_stack_docs.py

      - name: Kill planted mutations
        run: python3 scripts/gates/check_git_town_stack_docs.py --selftest

      - name: Run focused unit wrapper
        run: python3 -m unittest -q tests/test_git_town_stack_docs.py

      - name: Validate Agent entrypoint routes
        run: python3 scripts/gates/check_agent_docs.py

      - name: Validate README routes
        run: python3 scripts/gates/check_readme_coverage.py
