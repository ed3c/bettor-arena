name: Apply Phase 4 MCP surface contract

on:
  push:
    branches: [feat/stateless-mcp-bun]

permissions:
  contents: write

concurrency:
  group: apply-phase4-mcp-surface
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stateless-mcp-bun
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Patch explicit exposure and generic carrier declarations
        run: |
          bun <<'BUN'
          import { readFileSync, unlinkSync, writeFileSync } from "node:fs";

          const path = "loopctl/contract.json";
          let source = readFileSync(path, "utf8");

          function expose(loop, mode, target) {
            const ready = `      "target": "${target}",\n      "mcp_exposed": true,`;
            if (source.includes(ready)) return;
            const needle = `      "loop": "${loop}",\n      "mode": "${mode}",\n      "target": "${target}",`;
            const count = source.split(needle).length - 1;
            if (count !== 1) {
              throw new Error(`${loop}/${mode}: expected one target, found ${count}`);
            }
            source = source.replace(
              needle,
              `${needle}\n      "mcp_exposed": true,`,
            );
          }

          expose("micro", "prove", "proof_workflow/prove_micro_loop.sh");
          expose("micro", "test", "proof_workflow/control_micro_entry.sh");
          expose("ctg", "run", "loop_wiki/code-truth-graph/trigger.sh");
          expose("ctg", "prove", "proof_workflow/prove_ctg_loop.sh");
          expose("ctg", "test", "proof_workflow/control_ctg_entry.sh");

          const legacyKind = '        "kind": "ctg-inline-bundle@1.0.0",';
          const genericKind = '        "kind": "closed-inline-bundle@1.0.0",';
          if (source.includes(legacyKind)) {
            const count = source.split(legacyKind).length - 1;
            if (count !== 1) throw new Error(`legacy carrier count=${count}`);
            source = source.replace(legacyKind, genericKind);
          }
          if (!source.includes(genericKind)) {
            throw new Error("generic closed inline carrier is absent");
          }
          const resultLine = '        "result_file": "ctg-route-result.json",';
          if (!source.includes(resultLine)) {
            source = source.replace(genericKind, `${genericKind}\n${resultLine}`);
          }

          writeFileSync(path, source);
          unlinkSync(".github/workflows/apply-phase4-contract.yml");
          BUN

      - name: Commit the one-time contract migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loopctl/contract.json .github/workflows/apply-phase4-contract.yml
          git commit -m "feat: require explicit MCP exposure in loopctl"
          git pull --rebase origin feat/stateless-mcp-bun
          git push origin HEAD:feat/stateless-mcp-bun
