name: Modular contracts

# This is the repository's stable required workflow, declared in
# .github-delivery/ci-policy.json. Every clause below is load-bearing for that
# declaration: a draft PR does not bill a run, a repair is an explicit dispatch
# rather than a no-op commit, and the same head cancels its own older run.
#
# `ready_for_review` is the only pull_request type, which makes draft-first a
# requirement rather than a preference: the event fires on the draft -> ready
# transition, so a PR opened non-draft never triggers this workflow at all. Open
# every PR as a draft and mark it ready when it is asking to be merged; that
# moment is the one run this repository pays for.
#
# `synchronize` is deliberately absent: pushing a commit does not re-bill a run.
# Re-verification after a fix is an explicit workflow_dispatch, which is what
# makes scripts/gates/verify_modular_contracts.sh worth running first.
on:
  pull_request:
    types: [ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modular-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Test the exact PR head so the merge command can pin the verified SHA.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to immutable commit SHAs; a tag can be moved onto
      # different code without the reference changing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Compile modular-control compatibility entrypoints
        run: |
          python3 -m py_compile \
            scripts/arena_modules.py \
            scripts/arena_ownership.py \
            scripts/arena_lock.py \
            scripts/arena_proof.py \
            scripts/arena_context.py \
            scripts/arena_project.py \
            scripts/gates/check_agent_docs.py \
            scripts/gates/check_readme_coverage.py \
            scripts/gates/check_module_catalog.py \
            scripts/gates/check_mcp_policy.py \
            loopctl/mcp_tools.py \
            loopctl/mcp_runtime.py \
            loopctl/mcp_server.py

      - name: Compile Bun and TypeScript primary entrypoints
        run: |
          mkdir -p /tmp/bun-build
          bun build \
            loopctl/mcp_runtime.ts \
            loopctl/mcp_tools.ts \
            scripts/gates/check_mcp_policy.ts \
            scripts/project_types.ts \
            scripts/project_resolver.ts \
            scripts/project_transaction.ts \
            scripts/arena_project.ts \
            scripts/gates/check_project_bootstrap.ts \
            scripts/environment_types.ts \
            scripts/arena_origins.ts \
            scripts/arena_origin_checkout_probe.ts \
            scripts/arena_browser.ts \
            scripts/gates/check_environment_contracts.ts \
            --target=bun \
            --outdir=/tmp/bun-build

      - name: Prove Bun MCP policy and carrier can disagree
        run: |
          bun test loopctl/mcp_core.test.ts
          bun loopctl/mcp_tools.ts --selftest
          bun loopctl/mcp_runtime.ts --selftest
          bun scripts/gates/check_mcp_policy.ts --selftest

      - name: Prove Bun project planning and rollback can disagree
        run: bun scripts/gates/check_project_bootstrap.ts --selftest

      - name: Prove origin and browser contracts can disagree
        run: bun scripts/gates/check_environment_contracts.ts --selftest

      - name: Prove deterministic Python compatibility gates can disagree
        run: |
          python3 scripts/gates/check_agent_docs.py --selftest
          python3 scripts/gates/check_readme_coverage.py --selftest
          python3 scripts/arena_lock.py --selftest
          python3 scripts/arena_proof.py --selftest
          python3 scripts/arena_context.py --selftest

      - name: Check Agent, documentation, MCP, project, origin, and browser contracts
        run: |
          python3 scripts/gates/check_agent_docs.py
          python3 scripts/gates/check_readme_coverage.py
          bun scripts/gates/check_mcp_policy.ts
          bun scripts/gates/check_project_bootstrap.ts
          bun scripts/gates/check_environment_contracts.ts

      - name: Run external stateless MCP consumer canary
        run: sh tests/test_ctg_mcp_carrier.sh

      - name: Render one coherent expected modular release
        run: |
          mkdir -p /tmp/generated-contracts
          cp .arena/locks/bettor-arena.lock.json /tmp/original-bettor-arena.lock.json
          trap 'cp /tmp/original-bettor-arena.lock.json .arena/locks/bettor-arena.lock.json' EXIT
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output /tmp/generated-contracts/bettor-arena.lock.json
          cp /tmp/generated-contracts/bettor-arena.lock.json .arena/locks/bettor-arena.lock.json
          python3 scripts/arena_context.py lock \
            --output /tmp/generated-contracts/contexts.lock.json
          python3 scripts/arena_context.py parity \
            --output /tmp/generated-contracts/driver-parity.json
          python3 scripts/arena_proof.py subjects \
            --output /tmp/generated-contracts/subjects.lock.json
          python3 scripts/arena_proof.py release \
            --subjects /tmp/generated-contracts/subjects.lock.json \
            --output /tmp/generated-contracts/release-receipt.json
          bun loopctl/mcp_tools.ts loopctl/contract.json \
            --policy .arena/mcp-policy.json \
            > /tmp/generated-contracts/mcp-exposure.json
          bun scripts/arena_origins.ts status \
            --output /tmp/generated-contracts/origin-status.json
          bun scripts/arena_browser.ts status \
            --output /tmp/generated-contracts/browser-status.json
          cp /tmp/original-bettor-arena.lock.json .arena/locks/bettor-arena.lock.json
          trap - EXIT

      - name: Probe the GitHub distribution origin at the exact checked head
        run: |
          bun scripts/arena_origin_checkout_probe.ts \
            --origin github-cloud \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output /tmp/generated-contracts/github-origin-receipt.json

      - name: Upload expected modular contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expected-modular-contracts
          path: /tmp/generated-contracts
          if-no-files-found: error
          retention-days: 7

      - name: Compare checked-in modular contracts
        run: |
          python3 -c 'import json; assert json.load(open(".arena/locks/bettor-arena.lock.json")) == json.load(open("/tmp/generated-contracts/bettor-arena.lock.json"))'
          python3 -c 'import json; assert json.load(open(".arena/contexts.lock.json")) == json.load(open("/tmp/generated-contracts/contexts.lock.json"))'
          python3 -c 'import json; assert json.load(open("data/context-capsules/driver-parity.json")) == json.load(open("/tmp/generated-contracts/driver-parity.json"))'
          python3 -c 'import json; assert json.load(open("data/module-proof/subjects.lock.json")) == json.load(open("/tmp/generated-contracts/subjects.lock.json"))'
          python3 -c 'import json; assert json.load(open("data/module-proof/release-receipt.json")) == json.load(open("/tmp/generated-contracts/release-receipt.json"))'
          python3 -c 'import json; assert json.load(open("data/mcp/exposure.json")) == json.load(open("/tmp/generated-contracts/mcp-exposure.json"))'
          python3 -c 'import json; assert json.load(open("data/origins/status.json")) == json.load(open("/tmp/generated-contracts/origin-status.json"))'
          python3 -c 'import json; assert json.load(open("data/browser/status.json")) == json.load(open("/tmp/generated-contracts/browser-status.json"))'

      - name: Check current contracts through their stable gates
        run: |
          python3 scripts/gates/check_readme_coverage.py
          python3 scripts/gates/check_module_catalog.py
          python3 scripts/arena_proof.py check
          python3 scripts/arena_context.py check
          bun scripts/gates/check_mcp_policy.ts
          bun scripts/gates/check_project_bootstrap.ts
          bun scripts/gates/check_environment_contracts.ts

      - name: Print ownership coverage summary
        run: python3 scripts/arena_lock.py ownership > /tmp/ownership.json && python3 -c 'import json; x=json.load(open("/tmp/ownership.json")); print({"tracked_files":x["tracked_files"],"ownership_sha256":x["ownership_sha256"],"counts":x["counts"]})'

      - name: Prove placement gate can disagree
        run: python3 scripts/gates/check_placement.py --selftest

      - name: Check root placement contract
        run: python3 scripts/gates/check_placement.py
