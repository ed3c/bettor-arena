name: Modular contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile modular-control Python entrypoints
        run: |
          python3 -m py_compile \
            scripts/arena_modules.py \
            scripts/arena_ownership.py \
            scripts/arena_lock.py \
            scripts/arena_proof.py \
            scripts/gates/check_agent_docs.py \
            scripts/gates/check_module_catalog.py

      - name: Prove Agent entrypoint gate can disagree
        run: python3 scripts/gates/check_agent_docs.py --selftest

      - name: Check Agent entrypoint contract
        run: python3 scripts/gates/check_agent_docs.py

      - name: Prove ownership and composition gates can disagree
        run: python3 scripts/arena_lock.py --selftest

      - name: Render exact expected ownership-bound lock
        run: |
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output /tmp/bettor-arena.lock.json
          cat /tmp/bettor-arena.lock.json
          diff -u .arena/locks/bettor-arena.lock.json /tmp/bettor-arena.lock.json

      - name: Check module catalog, full ownership, and deterministic lock
        run: python3 scripts/gates/check_module_catalog.py

      - name: Prove module proof identity can disagree
        run: python3 scripts/arena_proof.py --selftest

      - name: Render exact module subjects and release receipt
        run: |
          python3 scripts/arena_proof.py subjects \
            --output /tmp/subjects.lock.json
          cat /tmp/subjects.lock.json
          diff -u data/module-proof/subjects.lock.json /tmp/subjects.lock.json
          python3 scripts/arena_proof.py release \
            --subjects /tmp/subjects.lock.json \
            --output /tmp/release-receipt.json
          cat /tmp/release-receipt.json
          diff -u data/module-proof/release-receipt.json /tmp/release-receipt.json

      - name: Check module-scoped proof subjects and release receipt
        run: python3 scripts/arena_proof.py check

      - name: Print ownership coverage summary
        run: python3 scripts/arena_lock.py ownership > /tmp/ownership.json && python3 -c 'import json; x=json.load(open("/tmp/ownership.json")); print({"tracked_files":x["tracked_files"],"ownership_sha256":x["ownership_sha256"],"counts":x["counts"]})'

      - name: Prove placement gate can disagree
        run: python3 scripts/gates/check_placement.py --selftest

      - name: Check root placement contract
        run: python3 scripts/gates/check_placement.py
