name: One-shot final convergence

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: one-shot-final-convergence-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Build and verify the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/generated-contracts
          exec > >(tee /tmp/generated-contracts/verification.log) 2>&1

          # The workflow is a one-run transport only. Restore the canonical
          # main workflow before generating any subject or release identity.
          git show origin/main:.github/workflows/modular-contracts.yml \
            > .github/workflows/modular-contracts.yml

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.arena/modules/knowledge-providers/module.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          target = 'scripts/check_blindspot_hybrid.py'
          for paths in (value['roots'], value['components']['proof']['paths']):
              if target not in paths:
                  paths.append(target)
          path.write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git add \
            .github/workflows/modular-contracts.yml \
            .arena/modules/knowledge-providers/module.json

          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output /tmp/generated-contracts/bettor-arena.lock.json
          cp /tmp/generated-contracts/bettor-arena.lock.json \
            .arena/locks/bettor-arena.lock.json

          python3 scripts/arena_context.py lock \
            --output /tmp/generated-contracts/contexts.lock.json
          cp /tmp/generated-contracts/contexts.lock.json \
            .arena/contexts.lock.json

          python3 scripts/arena_context.py parity \
            --output /tmp/generated-contracts/driver-parity.json
          cp /tmp/generated-contracts/driver-parity.json \
            data/context-capsules/driver-parity.json

          python3 scripts/arena_proof.py subjects \
            --output /tmp/generated-contracts/subjects.lock.json
          cp /tmp/generated-contracts/subjects.lock.json \
            data/module-proof/subjects.lock.json

          python3 scripts/arena_proof.py release \
            --subjects /tmp/generated-contracts/subjects.lock.json \
            --output /tmp/generated-contracts/release-receipt.json
          cp /tmp/generated-contracts/release-receipt.json \
            data/module-proof/release-receipt.json

          bun loopctl/mcp_tools.ts loopctl/contract.json \
            --policy .arena/mcp-policy.json \
            > /tmp/generated-contracts/mcp-exposure.json
          cp /tmp/generated-contracts/mcp-exposure.json \
            data/mcp/exposure.json

          bun scripts/arena_origins.ts status \
            --output /tmp/generated-contracts/origin-status.json
          cp /tmp/generated-contracts/origin-status.json \
            data/origins/status.json

          bun scripts/arena_browser.ts status \
            --output /tmp/generated-contracts/browser-status.json
          cp /tmp/generated-contracts/browser-status.json \
            data/browser/status.json

          git add \
            .arena/locks/bettor-arena.lock.json \
            .arena/contexts.lock.json \
            data/context-capsules/driver-parity.json \
            data/module-proof/subjects.lock.json \
            data/module-proof/release-receipt.json \
            data/mcp/exposure.json \
            data/origins/status.json \
            data/browser/status.json

          git diff --cached --check
          git -c user.name='bettor-arena one-shot verifier' \
              -c user.email='noreply@github.com' \
              commit -m 'verify: materialize final ownership repair tree'

          sh scripts/gates/verify_modular_contracts.sh
          sh tests/blindspot-hybrid/verify.sh
          sh tests/knowledge-providers/run-all.sh
          python3 scripts/gates/check_pdf_harness_integration.py
          python3 scripts/gates/check_pdf_terminal_sequence.py
          sh tests/ci-parity/run-all.sh
          test -z "$(git status --porcelain)"

          mkdir -p \
            /tmp/generated-contracts/final-tree/.arena/modules/knowledge-providers \
            /tmp/generated-contracts/final-tree/.arena/locks \
            /tmp/generated-contracts/final-tree/data/context-capsules \
            /tmp/generated-contracts/final-tree/data/module-proof \
            /tmp/generated-contracts/final-tree/data/mcp \
            /tmp/generated-contracts/final-tree/data/origins \
            /tmp/generated-contracts/final-tree/data/browser

          cp .arena/modules/knowledge-providers/module.json \
            /tmp/generated-contracts/final-tree/.arena/modules/knowledge-providers/module.json
          cp .arena/locks/bettor-arena.lock.json \
            /tmp/generated-contracts/final-tree/.arena/locks/bettor-arena.lock.json
          cp .arena/contexts.lock.json \
            /tmp/generated-contracts/final-tree/.arena/contexts.lock.json
          cp data/context-capsules/driver-parity.json \
            /tmp/generated-contracts/final-tree/data/context-capsules/driver-parity.json
          cp data/module-proof/subjects.lock.json \
            /tmp/generated-contracts/final-tree/data/module-proof/subjects.lock.json
          cp data/module-proof/release-receipt.json \
            /tmp/generated-contracts/final-tree/data/module-proof/release-receipt.json
          cp data/mcp/exposure.json \
            /tmp/generated-contracts/final-tree/data/mcp/exposure.json
          cp data/origins/status.json \
            /tmp/generated-contracts/final-tree/data/origins/status.json
          cp data/browser/status.json \
            /tmp/generated-contracts/final-tree/data/browser/status.json

          git rev-parse HEAD > /tmp/generated-contracts/verification-commit.txt
          git show --stat --oneline HEAD > /tmp/generated-contracts/verification-commit-stat.txt
          git diff HEAD^ HEAD --binary > /tmp/generated-contracts/final.patch
          find /tmp/generated-contracts/final-tree -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/generated-contracts/SHA256SUMS

      - name: Upload exact final tree and verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-shot-final-repair
          path: /tmp/generated-contracts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
