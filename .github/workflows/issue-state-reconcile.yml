name: Reconcile protected issue state

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-state-reconcile-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Plan reconciliation from repository authority
        id: plan
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 scripts/github/issue_state_guard.py check
          PLAN="$(python3 scripts/github/issue_state_guard.py plan --issue "$ISSUE_NUMBER" --event closed)"
          printf '%s\n' "$PLAN" > /tmp/issue-state-plan.json
          DECISION="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/issue-state-plan.json'))['decision'])
          PY
          )"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          cat /tmp/issue-state-plan.json
      - name: Reopen incomplete issue
        if: steps.plan.outputs.decision == 'REOPEN_REQUIRED'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          ACTIVE="$(python3 - <<'PY'
          import json
          q=json.load(open('docs/git/pdf-terminal-sequence.json'))['current']
          print(f"#{q['active_issue']} / order {q['active_order']}")
          PY
          )"
          REASON="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/issue-state-plan.json'))['reason'])
          PY
          )"
          gh issue reopen "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Issue-state guard restored OPEN because repository authority still marks this issue incomplete.\n\n- closed-event subject: issue #$ISSUE_NUMBER / node $EVENT_ID\n- repository authority: main@$MAIN_SHA\n- machine queue: $ACTIVE\n- reason: $REASON\n- evidence ceiling: issue UI state cannot proxy terminal completion, live provider execution, physical Worker fan-out, Git Town/Forgejo execution, queue advancement, or release admission.\n\nNo queue state, provider state, merge, promotion, rollback, or completion state was mutated by this guard."
      - name: Confirm no-action disposition
        if: steps.plan.outputs.decision == 'NO_ACTION'
        run: echo 'NO_ACTION: closed issue is not protected by repository authority.'
