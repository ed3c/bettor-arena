name: Parallel Agent Tech Lead

on:
  pull_request:
    paths:
      - 'loop_wiki/parallel-agent-tech-lead/**'
      - '.arena/modules/parallel-agent-tech-lead/**'
      - '.skill-bindings/agentic-tech-lead-orchestration/**'
      - 'loop_wiki/code-truth-graph-v2/**'
      - '.github/workflows/parallel-agent-tech-lead.yml'
  push:
    branches: [main]
    paths:
      - 'loop_wiki/parallel-agent-tech-lead/**'
      - '.arena/modules/parallel-agent-tech-lead/**'
      - '.skill-bindings/agentic-tech-lead-orchestration/**'
      - 'loop_wiki/code-truth-graph-v2/**'
      - '.github/workflows/parallel-agent-tech-lead.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate Bettor Tech Lead plan modes and controls
        run: sh loop_wiki/parallel-agent-tech-lead/tests/run-all.sh
      - name: Validate shared-Tech-Lead consumer binding
        run: sh tests/agentic-tech-lead-binding/run-all.sh
      - name: Validate context-funnel dependency
        run: sh loop_wiki/code-truth-graph-v2/tests/run-all.sh
      - name: Compile planner
        run: python3 -m py_compile loop_wiki/parallel-agent-tech-lead/scripts/plan.py
