name: Materialize LoopX Ledger payload

on:
  push:
    branches:
      - 'stage/loopx-ledger-v1-payload'
    paths:
      - '.bootstrap/loopx-ledger/**'
      - '.github/workflows/bootstrap-loopx-ledger-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-loopx-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reassemble and verify the exact local payload
        run: |
          cat .bootstrap/loopx-ledger/chunk-* > /tmp/loopx-ledger-payload.b64
          base64 --decode /tmp/loopx-ledger-payload.b64 > /tmp/loopx-ledger-payload.tgz
          echo '7fe71a71ac25ebd40c285442a31f28b6d09af30538ec800b84d8ae3758011650  /tmp/loopx-ledger-payload.tgz' | sha256sum --check --strict
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          archive = '/tmp/loopx-ledger-payload.tgz'
          allowed_roots = {
              'loop_wiki',
              '.arena',
              '.github',
          }
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit('payload archive is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not path.parts or path.parts[0] not in allowed_roots:
                      raise SystemExit(f'unexpected archive root: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member type: {member.name}')
          PY
          tar -xzf /tmp/loopx-ledger-payload.tgz

      - name: Remove the one-time carrier and run deterministic gates
        run: |
          rm -rf .bootstrap/loopx-ledger
          rm .github/workflows/bootstrap-loopx-ledger-payload.yml
          sh loop_wiki/loopx-ledger/tests/run-all.sh
          python3 scripts/arena_modules.py catalog >/dev/null

      - name: Commit only the decoded, tested implementation tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code --quiet && {
            echo 'materialized tree produced no change'
            exit 64
          }
          git commit -m 'feat: materialize LoopX Ledger v1 payload'
          git push origin "HEAD:${GITHUB_REF_NAME}"
