name: Restamp Phase 4 generated contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: restamp-phase4-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  restamp:
    if: github.event.pull_request.head.ref == 'feat/stateless-mcp-bun'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Render canonical generated contracts
        run: |
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output .arena/locks/bettor-arena.lock.json
          python3 scripts/arena_context.py lock \
            --output .arena/contexts.lock.json
          python3 scripts/arena_context.py parity \
            --output data/context-capsules/driver-parity.json
          python3 scripts/arena_proof.py subjects \
            --output data/module-proof/subjects.lock.json
          python3 scripts/arena_proof.py release \
            --subjects data/module-proof/subjects.lock.json \
            --output data/module-proof/release-receipt.json
          bun loopctl/mcp_tools.ts loopctl/contract.json \
            --policy .arena/mcp-policy.json \
            > data/mcp/exposure.json
          rm .github/workflows/restamp-phase4-contracts-pr.yml

      - name: Commit only generated contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .arena/locks/bettor-arena.lock.json \
            .arena/contexts.lock.json \
            data/context-capsules/driver-parity.json \
            data/module-proof/subjects.lock.json \
            data/module-proof/release-receipt.json \
            data/mcp/exposure.json \
            .github/workflows/restamp-phase4-contracts-pr.yml
          git commit -m "chore: restamp Bun MCP modular contracts"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
