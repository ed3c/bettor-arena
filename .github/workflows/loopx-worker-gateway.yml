name: LoopX Worker Gateway v1

on:
  push:
    branches:
      - 'feat/loopx-worker-gateway-v1'
    paths:
      - 'loop_wiki/loopx-worker-gateway/**'
      - '.arena/modules/loopx-worker-gateway/**'
      - '.github/workflows/loopx-worker-gateway.yml'
  pull_request:
    paths:
      - 'loop_wiki/loopx-worker-gateway/**'
      - '.arena/modules/loopx-worker-gateway/**'
      - '.github/workflows/loopx-worker-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopx-worker-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate six-host contracts, epistemic boundaries, fixture execution, and controls
        run: sh loop_wiki/loopx-worker-gateway/tests/run-all.sh

      - name: Validate the terminal module catalog without composition selection
        run: python3 scripts/arena_modules.py catalog >/dev/null
