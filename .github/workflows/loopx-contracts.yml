name: LoopX Contract v1

on:
  push:
    branches:
      - 'feat/loopx-contract-v1'
    paths:
      - 'loop_wiki/loopx-kernel/**'
      - '.arena/modules/loopx-kernel/**'
      - '.github/workflows/loopx-contracts.yml'
  pull_request:
    paths:
      - 'loop_wiki/loopx-kernel/**'
      - '.arena/modules/loopx-kernel/**'
      - '.github/workflows/loopx-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopx-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate contracts, controls, and planted mutations
        run: sh loop_wiki/loopx-kernel/tests/run-all.sh

      - name: Validate module manifest without selecting it in the composition
        run: python3 scripts/arena_modules.py catalog >/dev/null
