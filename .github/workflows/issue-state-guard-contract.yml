name: Issue state guard contract

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'docs/git/issue-state-guard.json'
      - 'docs/git/pdf-terminal-sequence.json'
      - 'docs/traceability/issue-146-golden-readiness.json'
      - 'scripts/github/issue_state_guard.py'
      - '.github/workflows/issue-state-guard-contract.yml'
      - '.github/workflows/issue-state-reconcile.yml'
  push:
    branches: [main]
    paths:
      - 'docs/git/issue-state-guard.json'
      - 'docs/git/pdf-terminal-sequence.json'
      - 'docs/traceability/issue-146-golden-readiness.json'
      - 'scripts/github/issue_state_guard.py'
      - '.github/workflows/issue-state-guard-contract.yml'
      - '.github/workflows/issue-state-reconcile.yml'

permissions:
  contents: read

concurrency:
  group: issue-state-guard-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile planner
        run: python3 -m py_compile scripts/github/issue_state_guard.py
      - name: Validate contract and planted controls
        run: |
          python3 scripts/github/issue_state_guard.py check
          python3 scripts/github/issue_state_guard.py selftest
      - name: Dry-run current protected issues
        run: |
          python3 scripts/github/issue_state_guard.py plan --issue 140 --event closed | tee /tmp/issue-140-plan.json
          python3 scripts/github/issue_state_guard.py plan --issue 146 --event closed | tee /tmp/issue-146-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for issue in (140, 146):
              data = json.loads(Path(f'/tmp/issue-{issue}-plan.json').read_text())
              assert data['decision'] == 'REOPEN_REQUIRED', data
          PY
