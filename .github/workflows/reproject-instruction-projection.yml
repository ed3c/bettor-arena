name: One-shot instruction reprojection

on:
  push:
    branches:
      - fix/instruction-projection-path-hygiene-v2

permissions:
  contents: write

concurrency:
  group: instruction-reprojection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Regenerate governed repository projections
        env:
          CANONICAL_COMMIT: abd53f016b428e7d922eecfa6d400cdccb928773
          MODULE_SHA256: 41f2d33c493ecc409c66e09e1f4976b7acb109ec9f8e972cf4073b06616e3d29
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          begin = "<!-- BEGIN SKILLS-SHARED INSTRUCTION PROJECTION -->"
          end = "<!-- END SKILLS-SHARED INSTRUCTION PROJECTION -->"
          canonical_commit = os.environ["CANONICAL_COMMIT"]
          expected_module_sha = os.environ["MODULE_SHA256"]
          module_path = Path(".github/reproject/instruction-projection.json")
          module_raw = module_path.read_bytes()
          observed_module_sha = hashlib.sha256(module_raw).hexdigest()
          if observed_module_sha != expected_module_sha:
              raise SystemExit(
                  f"module digest mismatch: {observed_module_sha} != {expected_module_sha}"
              )
          module = json.loads(module_raw)

          def render(role: str) -> str:
              role_text = module["projection_roles"][role]
              runtime_lines = "\n".join(
                  f"{index}. {item}"
                  for index, item in enumerate(module["runtime_order"], 1)
              )
              law_lines = "\n".join(f"- {item}" for item in module["hard_laws"])
              return f"""{begin}
          ## Shared runtime / delivery projection

          Canonical source: `ed3c/skills-shared@{canonical_commit}` → `skills/dual-forge-repository-loop/references/instruction-projection.json`
          Canonical module SHA-256: `{observed_module_sha}`
          Projection role: `{role}` — {role_text}

          Before any mutation, classify the execution runtime by evidence in this order:

          {runtime_lines}

          Mandatory laws:

          {law_lines}

          Do not edit this managed block manually. Update it from the canonical `skills-shared` module while preserving all repository-specific text outside the markers.
          {end}"""

          def outside(text: str) -> tuple[str, str]:
              start = text.find(begin)
              stop = text.find(end)
              if start == -1 or stop == -1 or stop < start:
                  raise SystemExit("managed block markers are absent or malformed")
              return text[:start], text[stop + len(end):]

          def replace(text: str, block: str) -> str:
              prefix, suffix = outside(text)
              return prefix + block + suffix

          rendered: dict[str, str] = {}
          for filename in ("AGENTS.md", "CLAUDE.md"):
              path = Path(filename)
              original = path.read_text(encoding="utf-8")
              expected_outside = outside(original)
              next_text = replace(original, render(filename))
              if outside(next_text) != expected_outside:
                  raise SystemExit(f"repository-owned text changed outside {filename} markers")
              path.write_text(next_text, encoding="utf-8")
              rendered[filename] = next_text

          def sha256_text(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          binding = {
              "schema_version": "instruction-projection-binding/v1",
              "canonical": {
                  "repository": "ed3c/skills-shared",
                  "commit": canonical_commit,
                  "module": (
                      "skills/dual-forge-repository-loop/references/"
                      "instruction-projection.json"
                  ),
                  "module_sha256": observed_module_sha,
              },
              "repository_projection": {
                  "AGENTS.md": {"sha256": sha256_text(rendered["AGENTS.md"])},
                  "CLAUDE.md": {"sha256": sha256_text(rendered["CLAUDE.md"])},
              },
              "global_claude": {
                  "state": "NOT_EXERCISED",
                  "receipt": "host-owned:global-claude-projection-receipt",
              },
          }
          binding_text = json.dumps(binding, indent=2, sort_keys=True) + "\n"
          binding_path = Path(".skill-bindings/instruction-projection.json")
          binding_path.parent.mkdir(parents=True, exist_ok=True)
          binding_path.write_text(binding_text, encoding="utf-8")

          patterns = (
              re.compile(r"(?<![A-Za-z0-9_.-])~/"),
              re.compile(r"/Users/"),
              re.compile(r"/home/"),
          )
          for label, text in {
              "AGENTS.md": rendered["AGENTS.md"],
              "CLAUDE.md": rendered["CLAUDE.md"],
              "binding": binding_text,
          }.items():
              for pattern in patterns:
                  match = pattern.search(text)
                  if match:
                      raise SystemExit(
                          f"{label} contains forbidden home locator {match.group(0)!r}"
                      )
          PY

      - name: Prove repository entrypoint and binding contracts
        run: |
          set -euo pipefail
          python3 scripts/gates/check_agent_docs.py --selftest
          python3 scripts/gates/check_agent_docs.py
          python3 -m json.tool .skill-bindings/instruction-projection.json >/dev/null

      - name: Commit only the regenerated projections
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/reproject-instruction-projection.yml \
            .github/reproject/instruction-projection.json
          git add AGENTS.md CLAUDE.md .skill-bindings/instruction-projection.json
          git commit -m "fix: reproject path-neutral repository instructions"
          git push origin "HEAD:${{ github.ref_name }}"
