name: repo-agent-native Bettor Binding

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - '.agents/skills/repo-agent-native'
      - '.claude/skills/repo-agent-native'
      - '.skill-bindings/repo-agent-native/**'
      - '.mcp.json'
      - '.codex/config.toml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/README.md'
      - 'docs/agents/**'
      - 'scripts/gates/check_repo_agent_native_binding.py'
      - '.github/workflows/repo-agent-native-binding.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/repo-agent-native'
      - '.claude/skills/repo-agent-native'
      - '.skill-bindings/repo-agent-native/**'
      - '.mcp.json'
      - '.codex/config.toml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/README.md'
      - 'docs/agents/**'
      - 'scripts/gates/check_repo_agent_native_binding.py'
      - '.github/workflows/repo-agent-native-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-agent-native-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binding:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate binding and planted negative controls
        run: |
          python3 scripts/gates/check_repo_agent_native_binding.py --selftest
          python3 scripts/gates/check_repo_agent_native_binding.py
      - name: Compile binding checker
        run: python3 -m compileall -q scripts/gates/check_repo_agent_native_binding.py
