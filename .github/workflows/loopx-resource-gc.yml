name: LoopX Resource GC v1

on:
  push:
    branches:
      - 'feat/loopx-resource-gc'
    paths:
      - 'loop_wiki/loopx-resource-gc/**'
      - '.arena/modules/loopx-resource-gc/**'
      - '.github/workflows/loopx-resource-gc.yml'
  pull_request:
    # ready_for_review is listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR opened as
    # a draft would skip this job and never re-run when it is marked ready,
    # leaving the module verified only by whatever branch push happened to fire.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'loop_wiki/loopx-resource-gc/**'
      - '.arena/modules/loopx-resource-gc/**'
      - '.github/workflows/loopx-resource-gc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopx-resource-gc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-gc:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate retention, rebuild proofs, residue verification, and planted controls
        run: sh loop_wiki/loopx-resource-gc/tests/run-all.sh

      - name: Validate the child module catalog without selecting it in the composition
        run: python3 scripts/arena_modules.py catalog >/dev/null
