name: PDF terminal advancement one-shot

on:
  push:
    branches:
      - feat/pdf-terminal-queue-advance-v1
    paths:
      - .github/workflows/one-shot-pdf-terminal-advance.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/pdf-terminal-queue-advance-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Advance queue and regenerate deterministic projections
        run: |
          set -euo pipefail
          RECEIPT=scripts/git-town/queue-receipts/stage-12-to-13.json
          python3 scripts/git-town/pdf_terminal_queue.py plan --receipt "$RECEIPT"
          python3 scripts/git-town/pdf_terminal_queue.py selftest --receipt "$RECEIPT"
          python3 scripts/git-town/pdf_terminal_queue.py apply --receipt "$RECEIPT"
          rm .github/workflows/one-shot-pdf-terminal-advance.yml
          git add -A
          git diff --cached --check
          mkdir -p /tmp/generated-contracts
          python3 scripts/arena_lock.py resolve --requirements .arena/compositions/bettor-arena.requirements.json --output /tmp/generated-contracts/bettor-arena.lock.json
          cp /tmp/generated-contracts/bettor-arena.lock.json .arena/locks/bettor-arena.lock.json
          python3 scripts/arena_context.py lock --output /tmp/generated-contracts/contexts.lock.json
          cp /tmp/generated-contracts/contexts.lock.json .arena/contexts.lock.json
          python3 scripts/arena_context.py parity --output /tmp/generated-contracts/driver-parity.json
          cp /tmp/generated-contracts/driver-parity.json data/context-capsules/driver-parity.json
          python3 scripts/arena_proof.py subjects --output /tmp/generated-contracts/subjects.lock.json
          cp /tmp/generated-contracts/subjects.lock.json data/module-proof/subjects.lock.json
          python3 scripts/arena_proof.py release --subjects /tmp/generated-contracts/subjects.lock.json --output /tmp/generated-contracts/release-receipt.json
          cp /tmp/generated-contracts/release-receipt.json data/module-proof/release-receipt.json
          bun loopctl/mcp_tools.ts loopctl/contract.json --policy .arena/mcp-policy.json > /tmp/generated-contracts/mcp-exposure.json
          cp /tmp/generated-contracts/mcp-exposure.json data/mcp/exposure.json
          bun scripts/arena_origins.ts status --output /tmp/generated-contracts/origin-status.json
          cp /tmp/generated-contracts/origin-status.json data/origins/status.json
          bun scripts/arena_browser.ts status --output /tmp/generated-contracts/browser-status.json
          cp /tmp/generated-contracts/browser-status.json data/browser/status.json
          git add -A
          git diff --cached --check
          git -c user.name='bettor-arena queue verifier' -c user.email='noreply@github.com' commit -m 'feat(queue): advance admitted #92 terminal to #140 [skip ci]'
      - name: Verify affected contracts
        run: |
          set -euo pipefail
          python3 scripts/gates/check_pdf_terminal_sequence.py --selftest
          python3 scripts/gates/check_pdf_terminal_sequence.py
          sh tests/git-town/run-all.sh
          sh tests/provider-canaries/run-all.sh
          sh tests/knowledge-providers/run-all.sh
          python3 scripts/gates/check_pdf_harness_integration.py
          sh scripts/gates/verify_modular_contracts.sh
          sh tests/ci-parity/run-all.sh
          test -z "$(git status --porcelain)"
      - name: Publish exact verified candidate
        run: git push origin HEAD:feat/pdf-terminal-queue-advance-v1
