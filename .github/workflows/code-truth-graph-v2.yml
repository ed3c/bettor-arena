name: Code Truth Graph v2

on:
  push:
    branches:
      - 'feat/loopx-code-truth-graph-v2'
    paths:
      - 'loop_wiki/code-truth-graph-v2/**'
      - '.arena/modules/code-truth-graph-v2/**'
      - '.github/workflows/code-truth-graph-v2.yml'
  pull_request:
    paths:
      - 'loop_wiki/code-truth-graph-v2/**'
      - '.arena/modules/code-truth-graph-v2/**'
      - '.github/workflows/code-truth-graph-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-truth-graph-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate evidence planes, Python AST reference, coverage and planted controls
        run: sh loop_wiki/code-truth-graph-v2/tests/run-all.sh
      - name: Validate module catalog without composition selection
        run: python3 scripts/arena_modules.py catalog >/dev/null
