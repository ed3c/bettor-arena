name: Dual-Agent program integration status

on:
  pull_request:
    paths:
      - "docs/architecture/dual-agent-program/**"
      - ".github/workflows/dual-agent-program-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate machine Stack index
        run: python -m json.tool docs/architecture/dual-agent-program/stack-index.json >/dev/null
      - name: Run integration status and planted refusal controls
        run: python docs/architecture/dual-agent-program/selftest.py
