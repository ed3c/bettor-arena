name: Blindspots 140 one-shot verification

on:
  push:
    branches:
      - repair/140-blindspots-verify
    paths:
      - .github/workflows/one-shot-blindspots-140.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/140-blindspots-verify
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Verify Blindspots leaf and affected contracts
        run: |
          set -euo pipefail
          sh loop_wiki/code-truth-graph-v2/tests/run-all.sh
          python3 scripts/gates/check_code_graph_rag_retirement.py
          python3 scripts/gates/check_agentic_tech_lead_binding.py
          sh tests/agentic-tech-lead-binding/run-all.sh
          python3 scripts/gates/check_pdf_terminal_sequence.py
          python3 scripts/gates/check_pdf_harness_integration.py
          sh scripts/gates/verify_modular_contracts.sh
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: Publish exact verified leaf
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-blindspots-140.yml
          git add -A
          git diff --cached --check
          git -c user.name='bettor-arena blindspots verifier' -c user.email='noreply@github.com' commit -m 'feat(blindspots): verify SQLite evidence leaf [skip ci]'
          git push origin HEAD:repair/140-blindspots-verify
