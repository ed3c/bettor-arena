name: PDF Harness integration audit

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/**'
      - '.arena/modules/**'
      - '.arena/compositions/**'
      - '.arena/locks/**'
      - '.arena/contexts/**'
      - '.arena/contexts.lock.json'
      - 'data/module-proof/**'
      - 'scripts/gates/check_pdf_harness_integration.py'
      - 'tests/test_pdf_harness_integration.py'
      - '.github/workflows/pdf-harness-integration.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/**'
      - '.arena/modules/**'
      - '.arena/compositions/**'
      - '.arena/locks/**'
      - '.arena/contexts/**'
      - '.arena/contexts.lock.json'
      - 'data/module-proof/**'
      - 'scripts/gates/check_pdf_harness_integration.py'
      - 'tests/test_pdf_harness_integration.py'
      - '.github/workflows/pdf-harness-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-harness-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate PDF integration matrix and current tree
        run: python3 scripts/gates/check_pdf_harness_integration.py
      - name: Prove the audit gate can turn red
        run: python3 scripts/gates/check_pdf_harness_integration.py --selftest
      - name: Run focused tests
        run: python3 -m unittest -q tests/test_pdf_harness_integration.py
      - name: Validate Agent and README routes
        run: |
          python3 scripts/gates/check_agent_docs.py
          python3 scripts/gates/check_readme_coverage.py --selftest
          python3 scripts/gates/check_readme_coverage.py
      - name: Validate modular composition and evidence projections
        run: |
          python3 scripts/gates/check_module_catalog.py
          python3 scripts/arena_context.py check
          python3 scripts/arena_proof.py check
