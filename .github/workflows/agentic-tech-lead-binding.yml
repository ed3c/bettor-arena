name: Agentic Tech Lead Bettor Binding

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - '.skill-bindings/agentic-tech-lead-orchestration/**'
      - '.skill-bindings/README.md'
      - 'docs/knowledge-providers/providers/code-graph-rag.json'
      - 'docs/knowledge-providers/registry.json'
      - 'scripts/gates/check_agentic_tech_lead_binding.py'
      - 'tests/agentic-tech-lead-binding/**'
      - '.github/workflows/agentic-tech-lead-binding.yml'
  push:
    branches: [main]
    paths:
      - '.skill-bindings/agentic-tech-lead-orchestration/**'
      - '.skill-bindings/README.md'
      - 'docs/knowledge-providers/providers/code-graph-rag.json'
      - 'docs/knowledge-providers/registry.json'
      - 'scripts/gates/check_agentic_tech_lead_binding.py'
      - 'tests/agentic-tech-lead-binding/**'
      - '.github/workflows/agentic-tech-lead-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-tech-lead-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binding:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate binding and planted negative controls
        run: sh tests/agentic-tech-lead-binding/run-all.sh
