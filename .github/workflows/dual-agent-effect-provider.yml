name: Dual-Agent effect provider boundary

on:
  pull_request:
    paths:
      - 'loop_wiki/dual-agent-effect-ledger/**'
      - '.github/workflows/dual-agent-effect-provider.yml'
  push:
    branches: [main]
    paths:
      - 'loop_wiki/dual-agent-effect-ledger/**'
      - '.github/workflows/dual-agent-effect-provider.yml'

permissions:
  contents: read

jobs:
  effect-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile provider boundary
        run: python3 -m py_compile loop_wiki/dual-agent-effect-ledger/effect_contract.py loop_wiki/dual-agent-effect-ledger/effect_reducer.py loop_wiki/dual-agent-effect-ledger/effect_policy_gate.py loop_wiki/dual-agent-effect-ledger/effect_provider_adapter.py loop_wiki/dual-agent-effect-ledger/test_effect_provider_adapter.py
      - name: Re-run parent effect reducer controls
        run: python3 loop_wiki/dual-agent-effect-ledger/test_effect_reducer.py
      - name: Re-run parent effect policy controls
        run: python3 loop_wiki/dual-agent-effect-ledger/test_effect_policy_gate.py
      - name: Run deterministic provider readback controls
        run: python3 loop_wiki/dual-agent-effect-ledger/test_effect_provider_adapter.py
