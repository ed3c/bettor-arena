name: Align Tech Lead retirement checker

on:
  push:
    branches: [feat/140-retire-code-graph-rag-final]
    paths: ['.github/workflows/one-shot-align-tech-lead-retirement.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/140-retire-code-graph-rag-final
          fetch-depth: 0
          persist-credentials: true
      - name: Replace historical-artifact assumption with absence invariant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/gates/check_agentic_tech_lead_binding.py')
          s = p.read_text()
          old_state = '"historical_code_graph_rag_state": "REJECTED",'
          new_state = '"historical_code_graph_rag_state": "RETIRED_FROM_CANONICAL_ROUTE",'
          if s.count(old_state) != 1:
              raise SystemExit(f'expected one historical-state marker, got {s.count(old_state)}')
          s = s.replace(old_state, new_state)
          start_marker = '''    try:\n        manifest = load(root / MANIFEST)\n        registry = load(root / REGISTRY)\n'''
          end_marker = '''\n    for relative in (README, ASSERTIONS, INDEX, CHECKER, SUITE, WORKFLOW):'''
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('historical manifest validation block not found')
          replacement = '''    if (root / MANIFEST).exists():\n        errors.append("retired Code-Graph-RAG manifest must remain ABSENT")\n    try:\n        registry = load(root / REGISTRY)\n    except Exception as exc:\n        errors.append(str(exc))\n    else:\n        entries = [\n            item\n            for item in registry.get("providers", [])\n            if isinstance(item, dict) and item.get("id") == "code-graph-rag"\n        ]\n        if entries:\n            errors.append("retired Code-Graph-RAG registry entry must remain ABSENT")\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-align-tech-lead-retirement.yml
          git diff --check
          git add -A
          git -c user.name='bettor-arena retirement patcher' -c user.email='noreply@github.com' commit -m 'retire(code-graph-rag): align Tech Lead gate [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin feat/140-retire-code-graph-rag-final
            git rebase origin/feat/140-retire-code-graph-rag-final
            if git push origin HEAD:feat/140-retire-code-graph-rag-final; then exit 0; fi
            sleep 2
          done
          exit 1
