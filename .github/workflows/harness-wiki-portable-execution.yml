name: harness-wiki Portable Execution Contract

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - '.agents/skills/harness-wiki/**'
      - '.github/workflows/harness-wiki-portable-execution.yml'
  push:
    branches:
      - main
      - 'refactor/**'
      - 'integration/**'
    paths:
      - '.agents/skills/harness-wiki/**'
      - '.github/workflows/harness-wiki-portable-execution.yml'
      - '.arena/locks/bettor-arena.lock.json'
      - 'data/module-proof/release-receipt.json'
      - 'data/module-proof/subjects.lock.json'
      - 'data/origins/status.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-wiki-portable-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate good, hollow, and independent mutation controls
        run: sh .agents/skills/harness-wiki/tests/run-all.sh
