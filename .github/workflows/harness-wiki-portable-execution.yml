name: harness-wiki Portable Execution Contract

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - '.agents/skills/harness-wiki/**'
      - '.github/workflows/harness-wiki-portable-execution.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/harness-wiki/**'
      - '.github/workflows/harness-wiki-portable-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-wiki-portable-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate good, hollow, and independent mutation controls
        run: sh .agents/skills/harness-wiki/tests/run-all.sh
