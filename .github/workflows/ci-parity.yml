name: CI parity v1

on:
  push:
    branches:
      - 'feat/loopx-ci-parity'
    paths:
      - 'scripts/gates/ci_parity/**'
      - '.github-delivery/ci-parity/**'
      - 'data/ci-parity/**'
      - 'tests/ci-parity/**'
      - '.github/workflows/**'
  pull_request:
    # ready_for_review is listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR opened as
    # a draft would skip this job and never re-run when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/gates/ci_parity/**'
      - '.github-delivery/ci-parity/**'
      - 'data/ci-parity/**'
      - 'tests/ci-parity/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, deliberately. The steps below all run in well under a minute and
  # GitHub bills whole minutes per job, so splitting them would cost four minutes
  # to save nothing: they share one gate and one failure surface, and the runner
  # names which step failed. This is the decision scripts/gates/ci_parity records
  # rather than leaving to whatever the file grew into.
  ci-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # This step is the one that reads every workflow in the tree, so a new
      # workflow added with a mutable action tag turns this red on its own PR
      # rather than on whichever later PR happened to look.
      - name: Validate the workflow index, parity verdicts, and planted controls
        run: sh tests/ci-parity/run-all.sh
