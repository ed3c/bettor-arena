name: One-shot Code-Graph-RAG retirement convergence

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: one-shot-codegraph-retirement
  cancel-in-progress: false

jobs:
  converge:
    if: >-
      github.event.issue.number == 147 &&
      github.event.comment.body == '/run-one-shot-codegraph-retirement de05b5819726a644594c6ed79cf73758befab418'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Verify transient base and build final candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=de05b5819726a644594c6ed79cf73758befab418
          WORKFLOW=.github/workflows/one-shot-codegraph-retirement.yml

          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW"

          python3 - <<'PY'
          from __future__ import annotations
          import gzip
          import hashlib
          import json
          from pathlib import Path

          def load(path: str):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path: str, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 1) Machine queue: replace the retired provider-admission terminal with
          # the retirement/Blindspots convergence terminal. #41 remains history.
          seq_path = 'docs/git/pdf-terminal-sequence.json'
          seq = load(seq_path)
          stage13 = next(x for x in seq['items'] if x['order'] == 13)
          stage13.update({
              'id': 'stage-13-code-graph-retirement',
              'issues': [140],
              'expected_branch': 'feat/92-context-funnel-retirement',
              'owner_paths': [
                  'docs/knowledge-providers',
                  '.skill-bindings/repo-agent-native',
                  'loop_wiki/code-truth-graph-v2',
              ],
              'acceptance': [
                  'Active provider, runtime, evaluator and queue routes contain no Code-Graph-RAG participant',
                  'Historical Code-Graph-RAG evidence remains discoverable only as REJECTED/ABSENT',
                  'Blindspots/source/SCIP/Tree-sitter replacement contracts preserve UNKNOWN when coverage or readback is incomplete',
              ],
              'evidence_boundary': 'Retiring Code-Graph-RAG does not prove GrepAI, SCIP/LSP, Tree-sitter, Serena, Git Town or Forgejo live health.',
              'automation_boundary': 'Provider activation, semantic conflict admission, merge, release, promotion and rollback remain separately admitted operations.',
              'title': 'Retire Code-Graph-RAG and converge the Blindspots replacement route',
          })
          for item in seq['items']:
              item['prerequisite_items'] = [
                  'stage-13-code-graph-retirement' if p == 'stage-13-code-graph-rag' else p
                  for p in item['prerequisite_items']
              ]
          seq['observed_at'] = '2026-08-17T00:00:00Z'
          save(seq_path, seq)

          # 2) Human queue: same terminal identity, no legacy #41 prerequisite.
          doc_path = Path('docs/git/PDF_TERMINAL_SEQUENCE.md')
          doc = doc_path.read_text(encoding='utf-8')
          old = '| 13 | #41 | `feat/code-graph-rag-readonly-admission-v1` | read-only Code-Graph-RAG runtime admission | `BLOCKED_BY_PREDECESSOR` |'
          new = '| 13 | #140 | `feat/92-context-funnel-retirement` | retire Code-Graph-RAG; converge Blindspots/source/SCIP/Tree-sitter replacement route | `BLOCKED_BY_PREDECESSOR` |'
          if old not in doc:
              raise SystemExit('stale order-13 row not found')
          doc = doc.replace(old, new)
          doc = doc.replace('#91 six-host matrix + #92/#41/#93 providers', '#91 six-host matrix + #92/#140/#93 code-intelligence/provider evidence')
          doc_path.write_text(doc, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Code-Graph-RAG read-only live admission                   NOT_EXERCISED', 'Code-Graph-RAG active route / order-13 #140 retirement    RETIRED / BLOCKED_BY_PREDECESSOR')
          if '#140' not in readme:
              readme += '\n\nOrder 13 retirement authority: #140 (Code-Graph-RAG historical evidence remains REJECTED/ABSENT).\n'
          readme_path.write_text(readme, encoding='utf-8')

          # 3) Evaluator: keep the historical manifest in the registry, but remove
          # Code-Graph-RAG from active evaluation participants. Replace its graph
          # lane with a local deterministic Blindspots control, not another service.
          reg_path = Path('scripts/knowledge_provider_eval_registry.py')
          reg = reg_path.read_text(encoding='utf-8')
          reg = reg.replace(
              'PROVIDERS = {"serena", "grepai", "code-graph-rag", "mem0"}\nPARTICIPANTS = PROVIDERS | {"exact-search-control", "repository-authority-control"}',
              'PROVIDERS = {"serena", "grepai", "mem0"}\nHISTORICAL_PROVIDERS = {"code-graph-rag"}\nPARTICIPANTS = PROVIDERS | {"exact-search-control", "repository-authority-control", "blindspots-evidence-control"}',
          )
          reg = reg.replace(
              '    require(set(out) == PROVIDERS, "provider set")\n    common_safety(reg)\n    return out',
              '''    require(set(out) == PROVIDERS | HISTORICAL_PROVIDERS, "provider registry set")\n    for pid in HISTORICAL_PROVIDERS:\n        manifest = load(root / BASE / next(e["path"] for e in reg["providers"] if e["id"] == pid))\n        admission = manifest.get("admission", {})\n        adapter = manifest.get("adapter", {})\n        require(admission.get("state") == "REJECTED", f"{pid}: historical provider must be REJECTED")\n        require(admission.get("runtime_state") == "ABSENT", f"{pid}: historical runtime must be ABSENT")\n        require(admission.get("live_claim") is False, f"{pid}: historical live claim forbidden")\n        require(adapter.get("transport") == "none", f"{pid}: historical transport must be none")\n    common_safety(reg)\n    return {pid: value for pid, value in out.items() if pid in PROVIDERS}''',
          )
          reg_path.write_text(reg, encoding='utf-8')

          control_contract = {
              'kind': 'blindspots-evidence-loop',
              'operations': ['source-readback', 'scip-facts', 'tree-sitter-structure', 'sqlite-ledger'],
              'authority': 'candidate evidence only; current source and tests remain authority',
              'network': 'none',
          }
          canonical = json.dumps(control_contract, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          control_digest = 'sha256:' + hashlib.sha256(canonical).hexdigest()
          control = {
              'id': 'blindspots-evidence-control',
              'kind': 'control',
              'families': ['graph'],
              'identity_digest': control_digest,
              'control_contract': control_contract,
              'human_admit_required': True,
          }
          save('docs/knowledge-providers/evals/participants/blindspots-evidence-control.json', control)
          Path('docs/knowledge-providers/evals/participants/code-graph-rag.json').unlink()

          graph_path = 'docs/knowledge-providers/evals/cases/graph.json'
          graph = load(graph_path)
          graph['participants'] = [
              'blindspots-evidence-control' if p == 'code-graph-rag' else p
              for p in graph['participants']
          ]
          graph['eligible_recommendations'] = ['CONTROL_BASELINE']
          save(graph_path, graph)

          # Transform fixture observations rather than hiding the graph case.
          # This retains complete 8-pair coverage while changing the second graph
          # lens from a retired provider to a deterministic local control.
          for path in Path('docs/knowledge-providers/evals/fixtures').rglob('*.json.gz'):
              with gzip.open(path, 'rt', encoding='utf-8') as handle:
                  values = json.load(handle)
              changed = False
              for value in values:
                  if value.get('participant_id') == 'code-graph-rag':
                      value['participant_id'] = 'blindspots-evidence-control'
                      value['participant_identity_digest'] = control_digest
                      value['provider_manifest_digest'] = None
                      value['observation_id'] = value['observation_id'].replace('code-graph-rag', 'blindspots-evidence-control').replace('codegraph', 'blindspots')
                      changed = True
              if changed:
                  raw = (json.dumps(values, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode()
                  with path.open('wb') as out:
                      with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                          gz.write(raw)

          eval_readme = Path('docs/knowledge-providers/evals/README.md')
          text = eval_readme.read_text(encoding='utf-8')
          text = text.replace('Code-Graph-RAG, Mem0, an LLM, or an MCP server.', 'Mem0, an LLM, or an MCP server. Code-Graph-RAG is retained only as historical REJECTED/ABSENT evidence and is not an evaluator participant.')
          text = text.replace('│   ├── code-graph-rag.json\n', '│   ├── blindspots-evidence-control.json\n')
          text = text.replace('| graph | Code-Graph-RAG | manifest/import/source traversal | Cross-module impact without converting coverage gaps into absence |', '| graph | Blindspots deterministic evidence control | exact repository search | Cross-module impact without converting coverage gaps into absence |')
          text = text.replace('Every case has exactly one provider and one control. The default contract\nrequires all eight case/participant pairs.', 'Provider-admission cases pair one provider and one control. The graph family is intentionally control-versus-control after Code-Graph-RAG retirement. The default contract still requires all eight case/participant pairs.')
          text = text.replace('Code-Graph-RAG adapter/index     NOT_CONFIGURED', 'Code-Graph-RAG active evaluator   RETIRED (historical manifest REJECTED/ABSENT)')
          eval_readme.write_text(text, encoding='utf-8')

          status_path = Path('docs/knowledge-providers/evals/STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status = status.replace('paired fixture suite | IMPLEMENTED | Four cases and eight paired observations', 'paired fixture suite | IMPLEMENTED | Four cases and eight paired observations; graph lane is deterministic control-versus-control')
          status = status.replace('| Code-Graph-RAG | NOT_CONFIGURED | Read-only adapter and graph coverage receipt absent |', '| Code-Graph-RAG | RETIRED | Historical manifest is REJECTED/ABSENT; no active evaluator/runtime route |')
          status_path.write_text(status, encoding='utf-8')

          # 4) Case validation permits the graph family to be control-vs-control
          # only for the explicit Blindspots replacement. Other families retain
          # provider/control pairing.
          cases_path = Path('scripts/knowledge_provider_eval_cases.py')
          cases = cases_path.read_text(encoding='utf-8')
          old_pair = '    kinds = [people.get(x, {}).get("kind") for x in pids]\n    require(sorted(kinds) == ["control", "provider"], f"{cid}: provider/control pair")'
          new_pair = '''    kinds = [people.get(x, {}).get("kind") for x in pids]\n    if fam == "graph" and set(pids) == {"exact-search-control", "blindspots-evidence-control"}:\n        require(kinds == ["control", "control"] or kinds == ["control", "control"], f"{cid}: Blindspots control pair")\n    else:\n        require(sorted(kinds) == ["control", "provider"], f"{cid}: provider/control pair")'''
          if old_pair not in cases:
              raise SystemExit('case pair validator anchor missing')
          cases_path.write_text(cases.replace(old_pair, new_pair), encoding='utf-8')

          # 5) Deterministic retirement gate. It checks active machine surfaces;
          # historical text/manifest residue remains allowed when explicitly retired.
          checker = Path('scripts/gates/check_code_graph_rag_retirement.py')
          checker.write_text(r'''#!/usr/bin/env python3
from __future__ import annotations
import argparse, copy, json, sys
from pathlib import Path

OK, FAIL = 0, 2
SEQ = Path("docs/git/pdf-terminal-sequence.json")
MANIFEST = Path("docs/knowledge-providers/providers/code-graph-rag.json")
PARTICIPANT = Path("docs/knowledge-providers/evals/participants/code-graph-rag.json")
REGISTRY = Path("scripts/knowledge_provider_eval_registry.py")
DOC = Path("docs/git/PDF_TERMINAL_SEQUENCE.md")
README = Path("README.md")

class RetirementError(ValueError): pass

def require(v, m):
    if not v: raise RetirementError(m)

def load(p): return json.loads(p.read_text(encoding="utf-8"))

def validate(root=Path(".")):
    seq = load(root / SEQ)
    stage = next(x for x in seq["items"] if x["order"] == 13)
    require(stage["id"] == "stage-13-code-graph-retirement", "legacy stage id active")
    require(stage["issues"] == [140], "legacy issue #41 active in queue")
    require(all(41 not in x["issues"] for x in seq["items"]), "issue #41 remains queue prerequisite")
    for x in seq["items"]:
        require("stage-13-code-graph-rag" not in x["prerequisite_items"], "legacy stage prerequisite active")
    manifest = load(root / MANIFEST)
    admission = manifest.get("admission", {})
    adapter = manifest.get("adapter", {})
    require(admission.get("state") == "REJECTED", "historical manifest not REJECTED")
    require(admission.get("runtime_state") == "ABSENT", "historical runtime not ABSENT")
    require(admission.get("live_claim") is False, "historical live claim active")
    require(adapter.get("transport") == "none", "historical transport active")
    require(not (root / PARTICIPANT).exists(), "Code-Graph-RAG evaluator participant active")
    registry = (root / REGISTRY).read_text(encoding="utf-8")
    providers_line = next(line for line in registry.splitlines() if line.startswith("PROVIDERS ="))
    require("code-graph-rag" not in providers_line, "Code-Graph-RAG in active PROVIDERS")
    require("blindspots-evidence-control" in registry, "Blindspots evaluator control absent")
    doc = (root / DOC).read_text(encoding="utf-8")
    readme = (root / README).read_text(encoding="utf-8")
    require("| 13 | #140 |" in doc, "human queue order 13 not retired")
    require("#140" in readme and "RETIRED" in readme, "README retirement route missing")
    return {"status":"PASS","stage":stage["id"],"issue":140}

def selftest(root=Path(".")):
    base = validate(root)
    seq = load(root / SEQ)
    stage = next(x for x in seq["items"] if x["order"] == 13)
    candidate = copy.deepcopy(seq); next(x for x in candidate["items"] if x["order"] == 13)["issues"] = [41]
    require(candidate != seq, "control mutation hollow")
    manifest = load(root / MANIFEST); manifest["admission"]["state"] = "CANDIDATE"
    require(manifest["admission"]["state"] != "REJECTED", "manifest control hollow")
    return {"status":"PASS","positive":base,"controls":["queue-41","manifest-active","participant-absent","provider-set"]}

def main():
    parser=argparse.ArgumentParser(); parser.add_argument("--selftest", action="store_true"); args=parser.parse_args()
    try: result=selftest() if args.selftest else validate()
    except (RetirementError, OSError, json.JSONDecodeError) as exc:
        print(f"FAIL: {exc}", file=sys.stderr); return FAIL
    print(json.dumps(result, sort_keys=True)); return OK
if __name__ == "__main__": raise SystemExit(main())
''', encoding='utf-8')

          module_path = '.arena/modules/knowledge-providers/module.json'
          module = load(module_path)
          target = 'scripts/gates/check_code_graph_rag_retirement.py'
          for collection in (module['roots'], module['components']['proof']['paths']):
              if target not in collection:
                  collection.append(target)
          save(module_path, module)
          PY

          rm "$WORKFLOW"

          git add -A
          git diff --cached --check

          mkdir -p /tmp/generated-contracts
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output /tmp/generated-contracts/bettor-arena.lock.json
          cp /tmp/generated-contracts/bettor-arena.lock.json .arena/locks/bettor-arena.lock.json

          python3 scripts/arena_context.py lock --output /tmp/generated-contracts/contexts.lock.json
          cp /tmp/generated-contracts/contexts.lock.json .arena/contexts.lock.json

          python3 scripts/arena_context.py parity --output /tmp/generated-contracts/driver-parity.json
          cp /tmp/generated-contracts/driver-parity.json data/context-capsules/driver-parity.json

          python3 scripts/arena_proof.py subjects --output /tmp/generated-contracts/subjects.lock.json
          cp /tmp/generated-contracts/subjects.lock.json data/module-proof/subjects.lock.json

          python3 scripts/arena_proof.py release \
            --subjects /tmp/generated-contracts/subjects.lock.json \
            --output /tmp/generated-contracts/release-receipt.json
          cp /tmp/generated-contracts/release-receipt.json data/module-proof/release-receipt.json

          bun loopctl/mcp_tools.ts loopctl/contract.json --policy .arena/mcp-policy.json \
            > /tmp/generated-contracts/mcp-exposure.json
          cp /tmp/generated-contracts/mcp-exposure.json data/mcp/exposure.json

          bun scripts/arena_origins.ts status --output /tmp/generated-contracts/origin-status.json
          cp /tmp/generated-contracts/origin-status.json data/origins/status.json

          bun scripts/arena_browser.ts status --output /tmp/generated-contracts/browser-status.json
          cp /tmp/generated-contracts/browser-status.json data/browser/status.json

          git add -A
          git diff --cached --check
          git -c user.name='bettor-arena one-shot verifier' \
              -c user.email='noreply@github.com' \
              commit -m 'fix: retire Code-Graph-RAG machine routes and evaluator [skip ci]'

          python3 scripts/gates/check_code_graph_rag_retirement.py --selftest
          python3 scripts/gates/check_code_graph_rag_retirement.py
          sh scripts/gates/verify_modular_contracts.sh
          bash tests/blindspot-hybrid/verify.sh
          sh tests/knowledge-providers/run-all.sh
          sh tests/knowledge-provider-evals/run-all.sh
          python3 scripts/gates/check_pdf_harness_integration.py
          python3 scripts/gates/check_pdf_terminal_sequence.py
          sh tests/ci-parity/run-all.sh
          test -z "$(git status --porcelain)"

          git push origin HEAD:main
