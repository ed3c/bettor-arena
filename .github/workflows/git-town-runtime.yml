name: Git Town runtime admission v1

on:
  push:
    branches:
      - 'feat/loopx-git-town'
    paths:
      - 'scripts/git-town/**'
      - '.github-delivery/git-town/**'
      - 'data/git-town/**'
      - 'tests/git-town/**'
      - 'docs/git/runtime/**'
      - '.github/workflows/git-town-runtime.yml'
  pull_request:
    # ready_for_review is listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR opened as
    # a draft would skip this job and never re-run when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/git-town/**'
      - '.github-delivery/git-town/**'
      - 'data/git-town/**'
      - 'tests/git-town/**'
      - 'docs/git/runtime/**'
      - '.github/workflows/git-town-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-town-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Git Town is deliberately not installed in this job. The runner must reach the
  # same EXECUTABLE_ABSENT state the receipts record, and the test suite asserts
  # it -- so an image that starts shipping git-town turns this red rather than
  # silently exercising a version nobody pinned.
  #
  # The physical controls build real repositories with a real bare remote in a
  # temporary directory. They need git, which every runner has, and nothing else.
  git-town-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate the admission ladder, command shape and bounded-sync invariants
        run: sh tests/git-town/run-all.sh
