name: Sync feature modular contracts

# This workflow keeps checked-in generated contracts aligned before the exact-head
# verification workflow decides whether a feature branch is mergeable.
on:
  push:
    branches:
      - 'feat/**'
      - 'integration/**'
      - 'refactor/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Apply one-shot portable Skill execution surface migration
        run: |
          python3 scripts/migrations/apply_skill_execution_surface.py
          python3 scripts/migrations/fix_skill_execution_module_enums.py

      - name: Render the coherent feature-branch release projections
        run: |
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output .arena/locks/bettor-arena.lock.json
          python3 scripts/arena_context.py lock \
            --output .arena/contexts.lock.json
          python3 scripts/arena_context.py parity \
            --output data/context-capsules/driver-parity.json
          python3 scripts/arena_proof.py subjects \
            --output data/module-proof/subjects.lock.json
          python3 scripts/arena_proof.py release \
            --subjects data/module-proof/subjects.lock.json \
            --output data/module-proof/release-receipt.json
          bun loopctl/mcp_tools.ts loopctl/contract.json \
            --policy .arena/mcp-policy.json \
            > data/mcp/exposure.json
          bun scripts/arena_origins.ts status \
            --output data/origins/status.json
          bun scripts/arena_browser.ts status \
            --output data/browser/status.json

      - name: Check generated projections before delivery
        run: |
          sh .agents/skills/harness-wiki/tests/run-all.sh
          sh loopctl/loopctl.sh --selftest
          sh loopctl/loopctl.sh skill-execution test
          python3 scripts/check_agent_runtime_module.py
          python3 scripts/gates/check_module_catalog.py
          python3 scripts/arena_proof.py check
          python3 scripts/arena_context.py check
          bun scripts/gates/check_mcp_policy.ts
          bun scripts/gates/check_project_bootstrap.ts
          bun scripts/gates/check_environment_contracts.ts

      - name: Commit generated portable execution surface and modular contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .agents/skills/harness-wiki/CONTEXT.md \
            .agents/skills/harness-wiki/modules/portable-execution-index.md \
            .agents/skills/harness-wiki/modules/portable-runner.md \
            .arena/modules/agent-runtime-integration/module.json \
            .arena/modules/agent-runtime-integration/README.md \
            scripts/check_agent_runtime_module.py \
            loopctl/contract.json \
            loopctl/loopctl.sh \
            loopctl/selftest.sh \
            loopctl/surface.lock \
            proof_workflow/prove_skill_execution.sh \
            proof_workflow/control_skill_execution_entry.sh \
            proof_workflow/control_agent_runtime_module.sh \
            proof_workflow/prove_agent_runtime.sh \
            .github/workflows/harness-wiki-portable-execution.yml \
            .arena/locks/bettor-arena.lock.json \
            .arena/contexts.lock.json \
            data/context-capsules/driver-parity.json \
            data/module-proof/subjects.lock.json \
            data/module-proof/release-receipt.json \
            data/mcp/exposure.json \
            data/origins/status.json \
            data/browser/status.json
          if git diff --cached --quiet; then
            echo "portable execution surface and generated modular contracts already current"
            exit 0
          fi
          git commit -m "feat: expose host-owned portable Skill execution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
