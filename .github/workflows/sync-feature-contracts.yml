name: Sync feature modular contracts

# One-shot feature-branch migration. The migration script removes itself before
# ownership/proof scans; the generic sync workflow is restored after generation.
on:
  push:
    branches:
      - 'refactor/knowledge-provider-contract-v1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Apply and remove one-shot knowledge-provider migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/migrations/apply_knowledge_provider_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '    compressed = base64.b64decode(BUNDLE.encode("ascii"), validate=True)'
          new = (
              '    payload = "".join(BUNDLE.split())\n'
              '    payload += "=" * (-len(payload) % 4)\n'
              '    compressed = base64.b64decode(payload.encode("ascii"), validate=True)'
          )
          if old not in text:
              raise SystemExit("migration decoder marker missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/migrations/apply_knowledge_provider_contract.py
          git rm -f scripts/migrations/apply_knowledge_provider_contract.py

      - name: Render coherent module, context, proof, and exposure projections
        run: |
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output .arena/locks/bettor-arena.lock.json
          python3 scripts/arena_context.py lock \
            --output .arena/contexts.lock.json
          python3 scripts/arena_context.py parity \
            --output data/context-capsules/driver-parity.json
          python3 scripts/arena_proof.py subjects \
            --output data/module-proof/subjects.lock.json
          python3 scripts/arena_proof.py release \
            --subjects data/module-proof/subjects.lock.json \
            --output data/module-proof/release-receipt.json
          bun loopctl/mcp_tools.ts loopctl/contract.json \
            --policy .arena/mcp-policy.json \
            > data/mcp/exposure.json
          bun scripts/arena_origins.ts status \
            --output data/origins/status.json
          bun scripts/arena_browser.ts status \
            --output data/browser/status.json

      - name: Validate provider contracts and repository projections
        run: |
          sh knowledge_providers/selftest.sh
          python3 scripts/gates/check_module_catalog.py
          python3 scripts/arena_proof.py check
          python3 scripts/arena_context.py check
          bun scripts/gates/check_mcp_policy.ts
          bun scripts/gates/check_project_bootstrap.ts
          bun scripts/gates/check_environment_contracts.ts

      - name: Commit provider contracts and generated projections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            scripts/migrations/apply_knowledge_provider_contract.py \
            knowledge_providers \
            .arena/modules/knowledge-provider-integration \
            .arena/compositions/bettor-arena.requirements.json \
            CONTEXT.md \
            .agents/skills/harness-wiki/modules/knowledge-provider-topology.md
          git add \
            .arena/locks/bettor-arena.lock.json \
            .arena/contexts.lock.json \
            data/context-capsules/driver-parity.json \
            data/module-proof/subjects.lock.json \
            data/module-proof/release-receipt.json \
            data/mcp/exposure.json \
            data/origins/status.json \
            data/browser/status.json
          if git diff --cached --quiet; then
            echo "knowledge-provider contracts and generated projections already current"
            exit 0
          fi
          git commit -m "feat: add subject-bound knowledge provider contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
