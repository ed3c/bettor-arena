name: Sync feature modular contracts

# This workflow keeps checked-in generated contracts aligned before the exact-head
# verification workflow decides whether a feature or governed documentation branch
# is mergeable. Documentation can change Macro Context selections and therefore
# requires the same deterministic projections as implementation branches.
on:
  push:
    branches:
      - 'feat/**'
      - 'integration/**'
      - 'refactor/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Render the coherent feature-branch release projections
        run: |
          python3 scripts/arena_lock.py resolve \
            --requirements .arena/compositions/bettor-arena.requirements.json \
            --output .arena/locks/bettor-arena.lock.json
          python3 scripts/arena_context.py lock \
            --output .arena/contexts.lock.json
          python3 scripts/arena_context.py parity \
            --output data/context-capsules/driver-parity.json
          python3 scripts/arena_proof.py subjects \
            --output data/module-proof/subjects.lock.json
          python3 scripts/arena_proof.py release \
            --subjects data/module-proof/subjects.lock.json \
            --output data/module-proof/release-receipt.json
          bun loopctl/mcp_tools.ts loopctl/contract.json \
            --policy .arena/mcp-policy.json \
            > data/mcp/exposure.json
          bun scripts/arena_origins.ts status \
            --output data/origins/status.json
          bun scripts/arena_browser.ts status \
            --output data/browser/status.json

      - name: Check generated projections before delivery
        run: |
          python3 scripts/gates/check_module_catalog.py
          python3 scripts/arena_proof.py check
          python3 scripts/arena_context.py check
          bun scripts/gates/check_mcp_policy.ts
          bun scripts/gates/check_project_bootstrap.ts
          bun scripts/gates/check_environment_contracts.ts

      - name: Commit only generated modular contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .arena/locks/bettor-arena.lock.json \
            .arena/contexts.lock.json \
            data/context-capsules/driver-parity.json \
            data/module-proof/subjects.lock.json \
            data/module-proof/release-receipt.json \
            data/mcp/exposure.json \
            data/origins/status.json \
            data/browser/status.json
          if git diff --cached --quiet; then
            echo "generated modular contracts already current"
            exit 0
          fi
          git commit -m "chore: sync generated modular contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
