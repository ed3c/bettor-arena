name: LoopX Harness Console v1

on:
  push:
    branches:
      - 'feat/loopx-harness-console'
    paths:
      - 'apps/harness-console/**'
      - 'services/hitl-api/**'
      - 'packages/harness-console-contracts/**'
      - 'tests/harness-console/**'
      - '.github/workflows/harness-console.yml'
  pull_request:
    # ready_for_review is listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR opened as
    # a draft would skip this job and never re-run when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/harness-console/**'
      - 'services/hitl-api/**'
      - 'packages/harness-console-contracts/**'
      - 'tests/harness-console/**'
      - '.github/workflows/harness-console.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job. The steps run in seconds and GitHub bills whole minutes per job, so
  # splitting the reducer, the request path and the view layer would cost three
  # minutes to tell us something the failing step name already says. This is the
  # decision scripts/gates/ci_parity asks for rather than leaving implicit.
  harness-console:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # No HITL_SIGNER_KEY is set here, and that is deliberate: the physical
      # control needs the unset case to exit 64, and a signer key in CI would be
      # a Human-held key living somewhere a workflow can read it.
      - name: Validate the projection, bounded views, signed requests and planted controls
        run: sh tests/harness-console/run-all.sh
