name: Knowledge provider contracts

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'docs/knowledge-providers/**'
      - 'scripts/check_knowledge_providers.py'
      - 'tests/knowledge-providers/**'
      - 'tests/test_knowledge_providers.py'
      - '.arena/modules/knowledge-providers/**'
      - '.arena/contexts/knowledge-providers.json'
      - '.arena/compositions/bettor-arena.requirements.json'
      - '.github/workflows/knowledge-providers.yml'
  push:
    branches: [main]
    paths:
      - 'docs/knowledge-providers/**'
      - 'scripts/check_knowledge_providers.py'
      - 'tests/knowledge-providers/**'
      - 'tests/test_knowledge_providers.py'
      - '.arena/modules/knowledge-providers/**'
      - '.arena/contexts/knowledge-providers.json'
      - '.arena/compositions/bettor-arena.requirements.json'
      - '.github/workflows/knowledge-providers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-providers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate provider contracts and planted negatives
        run: sh tests/knowledge-providers/run-all.sh
      - name: Validate module integration
        run: |
          python3 scripts/gates/check_module_catalog.py
          python3 scripts/arena_proof.py check
          python3 scripts/arena_context.py check
