name: LoopX Benchmark v1

on:
  push:
    branches:
      - 'feat/loopx-benchmark'
    paths:
      - 'loop_wiki/loopx-benchmark/**'
      - '.arena/modules/loopx-benchmark/**'
      - 'data/benchmarks/**'
      - '.github/workflows/loopx-benchmark.yml'
  pull_request:
    # ready_for_review is listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR opened as
    # a draft would skip this job and never re-run when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'loop_wiki/loopx-benchmark/**'
      - '.arena/modules/loopx-benchmark/**'
      - 'data/benchmarks/**'
      - '.github/workflows/loopx-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopx-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, and it runs the synthetic lane. A duration measured on a shared
  # runner is a fact about that runner at that moment, with neighbours nobody can
  # see; publishing it as a repository number is precisely what this module
  # exists to stop. The test runner asserts the report's locale is SYNTHETIC, so
  # a future edit that starts timing things here turns this red rather than
  # quietly producing a benchmark.
  loopx-benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate retained failures, comparability gates and the claim ladder
        run: sh loop_wiki/loopx-benchmark/tests/run-all.sh
