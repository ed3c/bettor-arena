name: Dual-Agent effect compensation

on:
  pull_request:
    paths:
      - 'loop_wiki/dual-agent-effect-ledger/**'
      - '.github/workflows/dual-agent-effect-compensation.yml'
  push:
    branches: [main]
    paths:
      - 'loop_wiki/dual-agent-effect-ledger/**'
      - '.github/workflows/dual-agent-effect-compensation.yml'

permissions:
  contents: read

jobs:
  effect-compensation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile compensation boundary
        run: python3 -m py_compile loop_wiki/dual-agent-effect-ledger/effect_contract.py loop_wiki/dual-agent-effect-ledger/effect_reducer.py loop_wiki/dual-agent-effect-ledger/effect_policy_gate.py loop_wiki/dual-agent-effect-ledger/effect_compensation.py loop_wiki/dual-agent-effect-ledger/test_effect_compensation.py
      - name: Re-run parent effect reducer controls
        run: python3 loop_wiki/dual-agent-effect-ledger/test_effect_reducer.py
      - name: Re-run parent effect policy controls
        run: python3 loop_wiki/dual-agent-effect-ledger/test_effect_policy_gate.py
      - name: Run linked compensation controls
        run: python3 loop_wiki/dual-agent-effect-ledger/test_effect_compensation.py
