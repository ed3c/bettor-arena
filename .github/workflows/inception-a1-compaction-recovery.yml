name: Inception A1 public verification

on:
  push:
    branches: [agent/inception-a1-compaction-recovery]
  pull_request:
    paths:
      - loop_wiki/inception-compaction-recovery/**
      - .arena/modules/inception-compaction-recovery/**
      - data/inception-compaction-recovery/**
      - .github/workflows/inception-a1-compaction-recovery.yml

permissions:
  contents: read

jobs:
  crash-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A1 verification manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifest = json.loads((root / "loop_wiki/inception-compaction-recovery/preflight.json").read_text())
          readme = (root / "loop_wiki/inception-compaction-recovery/README.md").read_text()
          exact = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A1",
              "stage": "OWNER_PUBLIC_VERIFICATION",
              "state": "CRASH_MATRIX_CANDIDATE",
              "repository": "ed3c/bettor-arena",
              "branch": "agent/inception-a1-compaction-recovery",
          }
          for key, value in exact.items():
              assert manifest.get(key) == value, f"DRIFT:{key}"
          base = manifest["base_subject"]
          assert base == {"commit": "6bf8f7966c02b49294e22b329a6fce68fa50a815", "tree": "05bc4982db6ea8a1609e4b5cc374a3db6a125da2"}
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["tree"] == "c3851a6953d456d0342a9776eed28561c1af0ca1"
          assert controller["packet_digest"] == "sha256:e20049d29ce3ddca00a6aa74802e042a562ca3ee7336f86e91cc945102ee9540"
          assert controller["bundle_digest"] == "sha256:dc4473b3195a738e55eb49c43661b6e1f4ea7f95c66749454776f2003b18ebc3"
          for key in (
              "state_machine", "existing_mechanisms", "implementation_subjects",
              "writable_paths", "read_only_paths", "resource_leases",
              "required_evidence_lanes", "positive_controls", "mutation_controls",
              "forbidden_actions", "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values and len(values) == len(set(values)), key
          assert not set(manifest["writable_paths"]) & set(manifest["read_only_paths"])
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "RUN_PUBLIC_CONTEXT_RECONSTRUCTION_FIXTURE_AND_SHADOW_READBACK"
          assert any(path.endswith("/test_crash_matrix.py") for path in manifest["implementation_subjects"])

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"], text=True
          ).splitlines()
          allowed_exact = {".github/workflows/inception-a1-compaction-recovery.yml"}
          allowed_prefixes = (
              "loop_wiki/inception-compaction-recovery/",
              ".arena/modules/inception-compaction-recovery/",
              "data/inception-compaction-recovery/",
          )
          violations = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          assert not violations, f"PATH_LEASE_VIOLATION:{violations}"
          required = {
              "loop_wiki/inception-compaction-recovery/checkpoint_contract.py",
              "loop_wiki/inception-compaction-recovery/test_checkpoint_contract.py",
              "loop_wiki/inception-compaction-recovery/test_crash_matrix.py",
          }
          assert required.issubset(set(changed)), "IMPLEMENTATION_SUBJECT_MISSING"

          combined = readme + json.dumps(manifest, ensure_ascii=False)
          forbidden = ["/" + "Users" + "/", "/" + "home" + "/", "/mnt/" + "data/", "gemini." + "google.com", "BEGIN " + "PRIVATE KEY"]
          assert not [value for value in forbidden if value in combined]
          print(f"PASS atom=INCEPTION-A1 changed={len(changed)} mutations={len(manifest['mutation_controls'])}")
          PY

      - name: Execute checkpoint contracts
        run: |
          python3 loop_wiki/inception-compaction-recovery/test_checkpoint_contract.py

      - name: Execute abrupt-process crash matrix
        run: |
          python3 loop_wiki/inception-compaction-recovery/test_crash_matrix.py

      - name: Compile exact Python subjects
        run: |
          python3 -m py_compile \
            loop_wiki/inception-compaction-recovery/checkpoint_contract.py \
            loop_wiki/inception-compaction-recovery/test_checkpoint_contract.py \
            loop_wiki/inception-compaction-recovery/test_crash_matrix.py

      - name: Check textual patch hygiene
        run: git diff --check
