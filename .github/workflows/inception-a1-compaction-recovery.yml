name: Inception A1 owner preflight

on:
  push:
    branches: [agent/inception-a1-compaction-recovery]
  pull_request:
    paths:
      - loop_wiki/inception-compaction-recovery/**
      - .arena/modules/inception-compaction-recovery/**
      - data/inception-compaction-recovery/**
      - .github/workflows/inception-a1-compaction-recovery.yml

permissions:
  contents: read

jobs:
  deterministic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A1 preparation manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifest = json.loads((root / "loop_wiki/inception-compaction-recovery/preflight.json").read_text())
          readme = (root / "loop_wiki/inception-compaction-recovery/README.md").read_text()
          exact = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A1",
              "stage": "OWNER_IMPLEMENTATION_PREPARATION",
              "state": "READY_FOR_FIRST_IMPLEMENTATION_COMMIT",
              "repository": "ed3c/bettor-arena",
              "branch": "agent/inception-a1-compaction-recovery",
          }
          for key, value in exact.items():
              assert manifest.get(key) == value, f"DRIFT:{key}"
          base = manifest["base_subject"]
          assert base == {"commit": "6bf8f7966c02b49294e22b329a6fce68fa50a815", "tree": "05bc4982db6ea8a1609e4b5cc374a3db6a125da2"}
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["tree"] == "c3851a6953d456d0342a9776eed28561c1af0ca1"
          assert controller["packet_digest"] == "sha256:e20049d29ce3ddca00a6aa74802e042a562ca3ee7336f86e91cc945102ee9540"
          assert controller["bundle_digest"] == "sha256:dc4473b3195a738e55eb49c43661b6e1f4ea7f95c66749454776f2003b18ebc3"
          list_fields = (
              "state_machine", "existing_mechanisms", "writable_paths", "read_only_paths",
              "resource_leases", "required_evidence_lanes", "positive_controls",
              "mutation_controls", "forbidden_actions", "claims_not_proven",
          )
          for key in list_fields:
              values = manifest.get(key)
              assert isinstance(values, list) and values and len(values) == len(set(values)), key
          assert not set(manifest["writable_paths"]) & set(manifest["read_only_paths"])
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "ADD_STRICT_CONTRACT_AND_FIRST_HOLLOW_OR_FAILING_CONTROL"
          assert "OWNER IMPLEMENTATION PREPARATION ONLY" in readme
          assert "No second generic ledger" in readme
          changed = subprocess.check_output(["git", "diff", "--name-only", f"{base['commit']}...HEAD"], text=True).splitlines()
          allowed = {
              "loop_wiki/inception-compaction-recovery/README.md",
              "loop_wiki/inception-compaction-recovery/preflight.json",
              ".github/workflows/inception-a1-compaction-recovery.yml",
          }
          assert not set(changed) - allowed, f"PATH_LEASE_VIOLATION:{sorted(set(changed) - allowed)}"
          combined = readme + json.dumps(manifest, ensure_ascii=False)
          forbidden = ["/" + "Users" + "/", "/" + "home" + "/", "/mnt/" + "data/", "gemini." + "google.com", "BEGIN " + "PRIVATE KEY"]
          assert not [value for value in forbidden if value in combined]
          print(f"PASS atom=INCEPTION-A1 changed={len(changed)} mutations={len(manifest['mutation_controls'])}")
          PY

      - name: Check textual patch hygiene
        run: git diff --check
