name: Inception A1 owner preflight

on:
  push:
    branches:
      - agent/inception-a1-compaction-recovery
  pull_request:
    paths:
      - loop_wiki/inception-compaction-recovery/**
      - .arena/modules/inception-compaction-recovery/**
      - data/inception-compaction-recovery/**
      - .github/workflows/inception-a1-compaction-recovery.yml

permissions:
  contents: read

jobs:
  deterministic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A1 preparation manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          manifest_path = root / "loop_wiki/inception-compaction-recovery/preflight.json"
          readme_path = root / "loop_wiki/inception-compaction-recovery/README.md"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          readme = readme_path.read_text(encoding="utf-8")

          expected = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A1",
              "stage": "OWNER_IMPLEMENTATION_PREPARATION",
              "state": "READY_FOR_FIRST_IMPLEMENTATION_COMMIT",
              "repository": "ed3c/bettor-arena",
              "branch": "agent/inception-a1-compaction-recovery",
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, f"DRIFT:{key}:{manifest.get(key)!r}"

          base = manifest["base_subject"]
          assert base == {
              "commit": "6bf8f7966c02b49294e22b329a6fce68fa50a815",
              "tree": "05bc4982db6ea8a1609e4b5cc374a3db6a125da2",
          }, "BASE_SUBJECT_DRIFT"
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["tree"] == "c3851a6953d456d0342a9776eed28561c1af0ca1"
          assert controller["packet_digest"] == "sha256:e20049d29ce3ddca00a6aa74802e042a562ca3ee7336f86e91cc945102ee9540"
          assert controller["bundle_digest"] == "sha256:dc4473b3195a738e55eb49c43661b6e1f4ea7f95c66749454776f2003b18ebc3"

          for key in (
              "state_machine",
              "existing_mechanisms",
              "writable_paths",
              "read_only_paths",
              "resource_leases",
              "required_evidence_lanes",
              "positive_controls",
              "mutation_controls",
              "forbidden_actions",
              "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, f"EMPTY_OR_MISSING:{key}"
              assert len(values) == len(set(values)), f"DUPLICATE:{key}"

          assert not (set(manifest["writable_paths"]) & set(manifest["read_only_paths"])), "LEASE_OVERLAP"
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "ADD_STRICT_CONTRACT_AND_FIRST_HOLLOW_OR_FAILING_CONTROL"
          assert "OWNER IMPLEMENTATION PREPARATION ONLY" in readme
          assert "No second generic ledger" in readme

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"],
              text=True,
          ).splitlines()
          allowed = {
              "loop_wiki/inception-compaction-recovery/README.md",
              "loop_wiki/inception-compaction-recovery/preflight.json",
              ".github/workflows/inception-a1-compaction-recovery.yml",
          }
          unexpected = sorted(set(changed) - allowed)
          assert not unexpected, f"PATH_LEASE_VIOLATION:{unexpected}"

          combined = readme + "\n" + json.dumps(manifest, ensure_ascii=False)
          for forbidden in ("/Users/", "/home/", "/mnt/data/", "gemini.google.com", "BEGIN PRIVATE KEY"):
              assert forbidden not in combined, f"PRIVATE_LOCATOR_OR_SECRET:{forbidden}"
          assert not re.search(r"(?i)(api[_-]?key|password|private[_-]?key)\s*[:=]\s*['\"][^'\"]+", combined)

          print(
              "PASS atom=INCEPTION-A1 state=READY_FOR_FIRST_IMPLEMENTATION_COMMIT "
              f"changed={len(changed)} mutations={len(manifest['mutation_controls'])}"
          )
          PY

      - name: Check textual patch hygiene
        run: git diff --check
