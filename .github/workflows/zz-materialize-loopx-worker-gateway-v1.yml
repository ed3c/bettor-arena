name: Materialize LoopX Worker Gateway v1

on:
  push:
    branches:
      - 'feat/loopx-worker-gateway-v1'
    paths:
      - '.delivery/loopx-worker-gateway-v1.tar.gz'
      - '.delivery/materialize_loopx_worker_gateway_v1.py'
      - '.github/workflows/zz-materialize-loopx-worker-gateway-v1.yml'

permissions:
  contents: write

concurrency:
  group: materialize-loopx-worker-gateway-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify and materialize the content-addressed terminal leaf
        run: python3 .delivery/materialize_loopx_worker_gateway_v1.py

      - name: Commit the exact materialized tree and remove the transient carrier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No materialization delta.'
            exit 0
          fi
          git commit -m 'feat: materialize LoopX Worker Gateway v1'
          git push origin HEAD:${GITHUB_REF_NAME}
