name: Parallel Tech Lead Contract

on:
  pull_request:
    # ready_for_review has to be listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR that opens
    # as a draft skips this job and never re-runs when it is marked ready --
    # leaving the layer verified only by a branch push, against whatever commit
    # that was rather than the head under review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agentic/parallel-tech-lead/**'
      - 'scripts/agentic/assert_parallel_tech_lead_contract.py'
      - '.agents/shared-skills.requirements.json'
      - '.github/workflows/parallel-tech-lead-contract.yml'
  push:
    branches: [main]
    paths:
      - '.agentic/parallel-tech-lead/**'
      - 'scripts/agentic/assert_parallel_tech_lead_contract.py'
      - '.agents/shared-skills.requirements.json'
      - '.github/workflows/parallel-tech-lead-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-tech-lead-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The plan pins an exact base commit and the checker resolves it, so
          # the default shallow clone would fail on a base older than the fetch
          # depth -- as a missing object rather than as a wrong base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind the run to the exact subject
        shell: bash
        run: |
          set -euo pipefail
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - name: Refuse the planted defects
        # selftest runs first on purpose. If the checker cannot be shown to go
        # red, its green on the committed layer is a claim about nothing.
        run: python3 scripts/agentic/assert_parallel_tech_lead_contract.py selftest
      - name: Assert the committed layer
        run: python3 scripts/agentic/assert_parallel_tech_lead_contract.py check
