name: Dual-Agent workflow compensation

on:
  pull_request:
    paths:
      - 'loop_wiki/dual-agent-offload-workflow/workflow_compensation.py'
      - 'loop_wiki/dual-agent-offload-workflow/test_workflow_compensation.py'
      - '.github/workflows/dual-agent-offload-workflow-compensation.yml'
  push:
    branches: [main]
    paths:
      - 'loop_wiki/dual-agent-offload-workflow/workflow_compensation.py'
      - 'loop_wiki/dual-agent-offload-workflow/test_workflow_compensation.py'
      - '.github/workflows/dual-agent-offload-workflow-compensation.yml'

permissions:
  contents: read

jobs:
  compensation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile compensation boundary
        run: python3 -m py_compile loop_wiki/dual-agent-offload-workflow/workflow_compensation.py loop_wiki/dual-agent-offload-workflow/test_workflow_compensation.py
      - name: Re-run reducer replay controls
        run: python3 loop_wiki/dual-agent-offload-workflow/test_workflow_replay.py
      - name: Run compensation cleanup matrix
        run: python3 loop_wiki/dual-agent-offload-workflow/test_workflow_compensation.py
