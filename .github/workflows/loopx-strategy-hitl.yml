name: LoopX Strategy + HITL v1

on:
  push:
    branches:
      - 'feat/loopx-strategy-hitl-v1'
    paths:
      - 'loop_wiki/loopx-strategy-hitl/**'
      - '.arena/modules/loopx-strategy-hitl/**'
      - '.github/workflows/loopx-strategy-hitl.yml'
  pull_request:
    # ready_for_review has to be listed explicitly: the default type set is
    # opened/synchronize/reopened, so with the draft guard below a PR that opens
    # as a draft skips this job and never re-runs it when it is marked ready.
    # The module would then be verified only by the branch push, against
    # whatever commit that was -- never against the head being reviewed.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'loop_wiki/loopx-strategy-hitl/**'
      - '.arena/modules/loopx-strategy-hitl/**'
      - '.github/workflows/loopx-strategy-hitl.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopx-strategy-hitl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strategy-hitl:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate contracts, admission pipeline, and planted controls
        run: sh loop_wiki/loopx-strategy-hitl/tests/run-all.sh

      - name: Validate the child module catalog without selecting it in the composition
        run: python3 scripts/arena_modules.py catalog >/dev/null
