# Project MCP policy for bettor-arena. Codex loads this layer only after the
# repo is trusted. Each stdio launcher resolves the active standard Git
# worktree before exec, so sessions started in nested directories cannot bind
# to a different root — the declarations below are portable to any clone.
#
# HOST SECTIONS PENDING (human-owned, never automated): permission profiles,
# network policy, unix-socket allowlists, and plugin toggles are host/session
# configuration with machine-specific paths. Add them here by hand per host;
# they are deliberately not versioned as part of the portable MCP payload.

[mcp_servers.grepai]
command = "sh"
args = [
  "-c",
  'repo_root="$(git rev-parse --show-toplevel)" || exit 1; cd "$repo_root" || exit 1; exec grepai mcp-serve',
]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
enabled_tools = [
  "grepai_index_status",
  "grepai_search",
  "grepai_trace_callees",
  "grepai_trace_callers",
  "grepai_trace_graph",
]

[mcp_servers.repo-context-pack]
command = "sh"
args = [
  "-c",
  'repo_root="$(git rev-parse --show-toplevel)" || exit 1; cd "$repo_root" || exit 1; exec uv run --project mcp/context-pack --frozen repo-context-pack-mcp',
]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 30
enabled_tools = [
  "build_python_context_pack",
  "context_pack_status",
]

[mcp_servers.serena]
command = "sh"
args = [
  "-c",
  'repo_root="$(git rev-parse --show-toplevel)" || exit 1; cd "$repo_root" || exit 1; exec uvx --from git+https://github.com/oraios/serena@32308a871c13f8fa5936c7d44a8bca710001277e serena start-mcp-server --context codex --project-from-cwd --enable-web-dashboard false --open-web-dashboard false --tool-timeout 60',
]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 60
enabled_tools = [
  "get_current_config",
  "initial_instructions",
  "search_for_pattern",
  "get_symbols_overview",
  "find_symbol",
  "find_referencing_symbols",
  "find_implementations",
  "find_declaration",
  "get_diagnostics_for_file",
]
